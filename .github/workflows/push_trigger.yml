name: Publish OpenG2P Helm charts

on:
  push:
    tags-ignore:
      - '**'
    branches:
      - 2.*
      - develop
  workflow_dispatch:
    inputs:
      forcePublishCharts:
        description: "Force publish Charts?"
        default: "*"
        type: string
      version:
        description: 'Explicit chart version (e.g. 2.0.1-g2p5466). Empty = derive from branch. Must be valid SemVer.'
        required: false
        type: string

jobs:
  generate-charts:
    runs-on: ubuntu-latest
    env:
      SKIP: 'FALSE'
      RANCHER_CHART_FILTER: "openg2p.org/add-to-rancher"
      FORCE_PUBLISH_CHARTS: "${{ inputs.forcePublishCharts || '' }}"
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Resolve chart version (branch-gated, with manual override)
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        # The published chart version is derived from the BRANCH NAME and applied
        # at package time via `helm package --version`, with a unique run-number
        # suffix so Rancher / the GH-Pages CDN never serve a stale cached chart
        # for a mutable version like 0.0.0-develop.
        BRANCH="${GITHUB_REF_NAME}"
        SUFFIX="${GITHUB_RUN_NUMBER}"          # monotonic + unique per run
        if [ -n "${INPUT_VERSION}" ]; then
          VER="${INPUT_VERSION}"               # manual override -> publish from any branch
        elif [ "$BRANCH" = "develop" ]; then
          VER="0.0.0-develop.${SUFFIX}"
        elif printf '%s' "$BRANCH" | grep -qE '^[0-9]+\.[0-9]+$'; then
          VER="${BRANCH}.0-develop.${SUFFIX}"  # active release line (Helm needs 3-part SemVer)
        elif printf '%s' "$BRANCH" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          VER="${BRANCH}"                       # frozen release, no suffix
        else
          echo "::warning::Branch '${BRANCH}' is not develop/N.N/N.N.N and no explicit version was given — skipping."
          echo "SKIP=TRUE" >> "$GITHUB_ENV"
          VER=""
        fi
        echo "CHART_VERSION=${VER}" >> "$GITHUB_ENV"
        echo "Resolved chart version for branch '${BRANCH}': ${VER:-<skipped>}"

    - id: files
      if: env.FORCE_PUBLISH_CHARTS == ''
      uses: jitterbit/get-changed-files@v1

    - name: save helm/charts to tmp.txt file
      run: |
        touch charts-list.txt
        if [ -n "${FORCE_PUBLISH_CHARTS}" ]; then
          for chart in charts/${FORCE_PUBLISH_CHARTS}/; do
            chart="${chart#charts/}"
            chart="${chart%/}"
            echo "$chart" >> charts-list.txt
          done
        else
          for changed_file in ${{ steps.files.outputs.all }}; do
            if [[ ${changed_file} =~ ^charts ]]; then
              chart_name=$(echo "${changed_file}" | awk -F/ '/^[charts]/{print $2}')
              echo $chart_name >> charts-list.txt;
              echo "Saved $chart_name chart to charts-list.txt"
            fi
          done
          cat charts-list.txt | sort | uniq > charts-list-unique.txt
          mv charts-list-unique.txt charts-list.txt
        fi
        echo "List of charts to be published";
        cat charts-list.txt

    - name: Generate tar files
      run: |
        if [ "${SKIP}" = "TRUE" ] || [ -z "${CHART_VERSION}" ]; then
          echo "::warning::No resolvable chart version — skipping publish";
          echo "SKIP=TRUE" >> $GITHUB_ENV
        elif [[ ! -s charts-list.txt ]]; then
          echo "::warning::No Charts to publish";
          echo "SKIP=TRUE" >> $GITHUB_ENV
        else
          for chartpath in charts/*/; do
            if [ -f ${chartpath}Chart.yaml ]; then
              helm dep up $chartpath
            fi
          done
          RANCHER_CHARTS=()
          while IFS= read -r chartpath; do
            echo "chartpath: $chartpath"
            chartname=$(basename "$chartpath")
            if [ -f charts/${chartname}/Chart.yaml ]; then
              echo "Chartname: $chartname"
              helm package charts/$chartpath --version "${CHART_VERSION}"
              is_rancher_chart=$(grep "$RANCHER_CHART_FILTER" charts/${chartpath%*/}/Chart.yaml || true)
              if [ -n "$is_rancher_chart" ]; then
                RANCHER_CHARTS+=("$chartname")
              fi
            fi
          done < charts-list.txt
          echo "RANCHER_CHARTS=${RANCHER_CHARTS[@]}" >> $GITHUB_ENV
          rm charts-list.txt
        fi

        shopt -s nocasematch
        if [[ '${{ github.repository_owner }}' != 'OpenG2P' ]]; then
          echo "SKIP=TRUE" >> $GITHUB_ENV
        fi
    - name: Upload tar as Artifact
      uses: actions/upload-artifact@v4
      with:
          name: charts
          path: ./*.tgz
      if: env.SKIP != 'TRUE'

    - name: Checkout branch for publishing
      uses: actions/checkout@v3
      with:
          repository: 'openg2p/openg2p-helm'
          ref: gh-pages
          token: ${{ secrets.OPENG2P_BOT_GITHUB_PAT }}
      if: env.SKIP != 'TRUE'

    - name: Download tar from Artifacts
      uses: actions/download-artifact@v4
      with:
          name: charts
          path: ./
      if: env.SKIP != 'TRUE'

    - name: Update index.yaml
      run: |
        helm repo index .
        for chartname in $RANCHER_CHARTS; do
          cp ${chartname}*.tgz rancher/
        done
        helm repo index --url ../ --merge rancher/index.yaml rancher
        for chartname in $RANCHER_CHARTS; do
          rm rancher/${chartname}*.tgz || true
        done
      if: env.SKIP != 'TRUE'

    - name: Commit Changes to repository
      uses: EndBug/add-and-commit@v7
      with:
        branch: gh-pages
        author_name: openg2pbot
        author_email: bot@openg2p.org
        default_author: user_info
        message: 'added common helm charts for publish openg2p/openg2p-deployment-commons@${{ github.sha }}'
        add: './*.tgz ./index.yaml rancher/index.yaml'
      if: env.SKIP != 'TRUE'
