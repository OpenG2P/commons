questions:

# General
- variable: global.baseDomain
  description: >-
    Base domain for all services. All service hostnames are derived as
    <service>.baseDomain (e.g., superset.example.openg2p.org).
  type: string
  label: Base Domain
  required: true
  group: General

# Keycloak
- variable: global.keycloakBaseUrl
  description: Keycloak Base Url used in all components
  type: string
  label: Keycloak Base URL
  group: Keycloak

# Master data
- variable: masterData.enabled
  type: boolean
  label: Enable Master Data service
  group: Master Data

# PostgreSQL
- variable: postgresql.enabled
  description: Disable for external PostgreSQL server
  type: boolean
  label: Install PostgreSQL
  group: Postgres

- variable: global.postgresqlHost
  description: Hostname of PostgreSQL installation. Change this only for external PostgreSQL server.
  type: string
  label: PostgreSQL Hostname
  group: Postgres

- variable: postgres-init.postgresql.existingSecret
  description: >-
    Name of the Kubernetes secret containing the PostgreSQL superuser password.
    Change this when using an external PostgreSQL server.
  type: string
  label: PostgreSQL Password Secret Name
  group: Postgres

# Mail
- variable: mail.enabled
  description: This installs Mail server for relaying SMTP requests to preferred backend.
  type: boolean
  label: Install Mail SMTP Server?
  group: Mail

- variable: global.mailInstallationName
  description: Hostname of the Mail server. Change for external installations.
  type: string
  label: Mail Server Hostname
  group: Mail

# ODK
- variable: odk-central.enabled
  description: This installs ODK Central
  type: boolean
  label: Install ODK Central?
  group: ODK

# Minio
- variable: minio.enabled
  description: This installs Minio for document store.
  type: boolean
  label: Install Minio?
  group: Minio

# Opensearch
- variable: opensearch.enabled
  description: This installs OpenSearch.
  type: boolean
  label: Install OpenSearch?
  group: Opensearch

# Kafka
- variable: kafka.enabled
  description: This installs Kafka.
  type: boolean
  label: Install Kafka?
  group: Kafka

- variable: kafkaUi.enabled
  description: This installs Kafka UI
  type: boolean
  label: Install Kafka UI?
  group: Kafka

# Reporting
- variable: reporting.enabled
  description: This installs Reporting Framework.
  type: boolean
  label: Install Reporting Framework?
  group: Reporting

# Keymanager
- variable: keymanager.enabled
  description: This installs Keymanager.
  type: boolean
  label: Install Keymanager?
  group: Keymanager

- variable: keymanager.istio.enabled
  label: Expose Keymanager APIs
  description: >-
    Enable this to manually download/upload certificates to Keymanager.
    This exposes Keymanager APIs publicly outside Kubernetes.
  type: boolean
  group: Keymanager

- variable: keymanager.keystoreType
  label: Keystore Type
  description: PKCS11 for HSM. PKCS12 for storing into local p12 file.
  type: enum
  options:
    - PKCS11
    - PKCS12
  group: Keymanager

- variable: keymanager.persistence.enabled
  label: Persistence Enabled
  description: Enable this if Keystore Type is PKCS12.
  type: boolean
  group: Keymanager

- variable: softhsm.enabled
  label: Install Softhsm?
  description: Enable this if Keystore Type is PKCS11.
  type: boolean
  group: Keymanager

# Superset
- variable: superset.enabled
  description: Install Superset
  type: boolean
  label: Install Superset?
  group: Superset


# eSignet
- variable: esignet.enabled
  description: This installs eSignet for mocking user authentication
  type: boolean
  label: Install eSignet?
  group: eSignet

# Mock Identity Settings
- variable: mock-identity-system.enabled
  description: This installs Mock Identity System. Install only when eSignet is installed
  type: boolean
  label: Install Mock Identity System?
  group: eSignet
