global:
  baseDomain: trial.openg2p.org
  # Derived from baseDomain. Override only when using an external Keycloak.
  keycloakBaseUrl: 'https://keycloak.{{ .Values.global.baseDomain }}'
  # Internal (in-cluster) URL for pod-to-Keycloak communication (HTTP, no TLS).
  keycloakInternalUrl: 'http://{{ .Release.Name }}-keycloak:80'
  # Keycloak realm where OIDC clients live (staff-<namespace>).
  keycloakRealm: staff
  # Internal issuer URL — used by backend pods for OIDC discovery, JWK fetching, token validation.
  # Uses keycloakInternalUrl (HTTP) when set, otherwise falls back to keycloakBaseUrl (HTTPS).
  keycloakIssuerUrl: '{{ (tpl (.Values.global.keycloakInternalUrl | default .Values.global.keycloakBaseUrl) $) }}/realms/{{ tpl .Values.global.keycloakRealm $ }}'
  # External issuer URL — used for browser-facing OAuth redirects (authorize endpoint, login redirects).
  # Always uses keycloakBaseUrl so the browser can reach it.
  keycloakExternalIssuerUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/{{ tpl .Values.global.keycloakRealm $ }}'

  # Service hostnames owned by commons-base — single source of truth used by both
  # the actual service deployments and the keycloak-init redirect URIs below.
  kafkaUiHostname: 'kafka.{{ .Values.global.baseDomain }}'
  minioHostname: 'minio.{{ .Values.global.baseDomain }}'

  postgresqlHost: '{{ .Release.Name }}-postgresql'
  # PostgreSQL superuser secret. Defaults to the embedded chart's auto-created secret.
  #
  # ── External PostgreSQL ─────────────────────────────────────────────────────
  # When using an external PostgreSQL (postgresql.enabled=false), you MUST
  # pre-create a Kubernetes secret holding the superuser password BEFORE
  # running `helm install`. Helm cannot create this secret on the fly because
  # subcharts (postgres-init, keycloak, etc.) reference it during render.
  #
  #   kubectl create secret generic external-pg-superuser \
  #     -n <namespace> \
  #     --from-literal=postgres-password='<superuser-password>'
  #
  # Then install with:
  #   --set postgresql.enabled=false \
  #   --set global.postgresqlHost=<external-host> \
  #   --set global.postgresqlSecret=external-pg-superuser
  #
  # If your secret uses a different key name, also override:
  #   --set global.postgresqlSecretKey=<your-key-name>
  # ────────────────────────────────────────────────────────────────────────────
  postgresqlSecret: '{{ .Release.Name }}-postgresql'
  postgresqlSecretKey: postgres-password
  mailInstallationName: '{{ .Release.Name }}-mail'
  minioInstallationName: '{{ .Release.Name }}-minio'

  sysAdminEmail: admin@openg2p.sandbox.org
  redisInstallationName: '{{ .Release.Name }}-redis'
  redisAuthInstallationName: '{{ .Release.Name }}-redis-auth'

keycloak-init:
  enabled: true
  keycloak:
    # Internal URL for keycloak-init to reach Keycloak. Falls back to global.keycloakBaseUrl if empty.
    url: 'http://{{ .Release.Name }}-keycloak:80'
    user: admin
    password: ''
    # Points to the Keycloak chart's auto-created admin secret.
    existingSecret: '{{ .Release.Name }}-keycloak'
    existingSecretKey: admin-password
  job:
    backoffLimit: 3
    ttlSecondsAfterFinished: 86400
  # Email for the default staff-realm admin user. Kept as a SCALAR (not an
  # array-index override) on purpose: Helm --set / -f on a list element like
  # users[0].email REPLACES the whole element, wiping username/password/
  # clientRoleMappings and breaking keycloak-init (KeyError: 'username').
  # The user's email below is templated from this value, so overriding this
  # scalar (Rancher question / install script) is safe.
  staffAdminEmail: admin@openg2p.org
  # Only commons-related clients. Other module clients are added by their own charts.
  realms:
    master:
      themes:
        loginTheme: openg2p-admin
        adminTheme: openg2p-admin
      clients: []
    staff:
      themes:
        loginTheme: staff-portal
        adminTheme: staff-portal
      # Only clients for services owned by commons-base (kafka-ui, minio
      # console). Service-owned clients (superset, odk, staff-portal) are
      # created by commons-services keycloak-init.
      clients:
        - clientId: openg2p-kafka
          name: Kafka
          redirectUris:
            - 'https://{{ tpl .Values.global.kafkaUiHostname $ }}/*'
          clientRoles: ["Admin"]
        - clientId: openg2p-minio
          name: MinIO
          redirectUris:
            - 'https://{{ tpl .Values.global.minioHostname $ }}/*'
          clientRoles: ["consoleAdmin"]
      users:
        - username: admin
          password: admin
          firstName: Admin
          lastName: User
          # Templated from the staffAdminEmail scalar above (rendered via tpl in
          # the keycloak-init configmap). Override staffAdminEmail, not this.
          email: '{{ .Values.staffAdminEmail | default "admin@openg2p.org" }}'
          # Only mappings for clients owned by commons-base. The services chart's
          # keycloak-init adds mappings for superset, odk, staff-portal.
          clientRoleMappings:
            openg2p-kafka:
              - "Admin"
            openg2p-minio:
              - "consoleAdmin"

postgresql:
  enabled: true
  auth:
    postgresPassword: ""
  additionalDbs:
    enabled: false
  primary:
    extendedConfiguration: |-
      wal_level = logical
      max_wal_senders = 20
      max_replication_slots = 300
      max_connections = 500
    # Based on observed usage ~320Mi. For production, increase limit to 2-4Gi.
    resourcesPreset: "none"
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
    extraEnvVars:
      - name: POSTGRES_POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: '{{ include "postgresql.v1.primary.fullname" . }}'
            key: postgres-password
  istio:
    enabled: false
    virtualservice:
      enabled: true
      host: "*"
      gateway: ""
      matchPort: 5432
      destination: '{{ include "postgresql.v1.primary.fullname" . }}'
      destinationPort: "5432"
    gateway:
      enabled: true
      port: 5432
      host: "*"
      ingressController:
        istio: ingressgateway
      tls:
        enabled: false
        mode: SIMPLE
        credentialName: ""

postgres-init:
  enabled: true
  # postgres-init runs as a regular Job (the subchart default). It must NOT be
  # a Helm hook here: PostgreSQL is embedded in this same release, so a
  # pre-install hook runs before PG/its secret exist, and a post-install hook
  # deadlocks behind apps (e.g. Keycloak) that can't go Ready until these DBs
  # exist. As a regular resource the Job waits for PG via pg_isready and apps
  # retry until their DBs appear. (Helm deep-merge can't strip hook keys baked
  # into a packaged subchart — even null won't — so this relies on the
  # subchart default being annotations: {}.)
  postgresql:
    host: '{{ tpl .Values.global.postgresqlHost $ }}'
    port: 5432
    existingSecret: '{{ tpl .Values.global.postgresqlSecret $ }}'
    existingSecretPostgresPasswordKey: '{{ tpl .Values.global.postgresqlSecretKey $ }}'
  databases:
    # We are creating the following databases as the respective charts don't create on their own.
    # Note that Keymanager creates DB on its own.
    - name: superset
      # As expected by Superset chart
      user: superset
      secret: superset-db-user
      secretUserPasswordKey: superset-db-user-password
    - name: odkdb
      user: odkuser
      secret: odk-db-user
      secretUserPasswordKey: odk-db-user-password
    - name: mosip_keymgr
      user: keymgruser
      secret: keymgr-db-user
      secretUserPasswordKey: keymgr-db-user-password
    - name: mosip_mockidentitysystem
      user: mockidsystemuser
      secret: mockid-db-user
      secretUserPasswordKey: mockid-db-user-password
    # Although esignet runs postgres init we are creating the DB and user
    # because we want the user password to be in a secret and not directly
    # passed
    - name: mosip_esignet
      user: esignetuser
      secret: esignet-db-user
      secretUserPasswordKey: esignet-db-user-password
    - name: keycloak
      user: keycloakuser
      secret: keycloak-db-user
      secretUserPasswordKey: keycloak-db-user-password

mail:
  enabled: false
  mailname: admin@openg2p.sandbox.org

# Redis without auth enabled.
redis:
  # Default name of the redis service is .Release.Name-redis-master
  enabled: true
  architecture: standalone
  image:
    registry: docker.io
    repository: openg2p/redis
    tag: 7.2.5-debian-12-r4
  auth:
    enabled: false
  master:
    resourcesPreset: none
    # Redis is lightweight (~3Mi observed). Limit ample for growth.
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
    persistence:
      enabled: false

# Redis with authentication enabled required by services like eSignet
redis-auth:
  enabled: true
  # We override the name here
  nameOverride: "redis-auth"
  architecture: standalone
  image:
    registry: docker.io
    repository: openg2p/redis
    tag: 7.2.5-debian-12-r4
  auth:
    enabled: true
  master:
    resourcesPreset: none
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
    persistence:
      enabled: false

minio:
  enabled: true
  hostname: '{{ tpl .Values.global.minioHostname $ }}'
  persistence:
    enabled: true
    size: 16Gi
  # Based on observed usage ~100Mi. Increase for heavy S3 workloads.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  # Parent-owned Secret so root + readonly keys share commons-minio.
  auth:
    existingSecret: '{{ .Release.Name }}-minio'
    rootUser: admin
    rootPassword: ""
  initContainers:
    - name: wait-for-keycloak
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          until wget -qO- {{ tpl .Values.global.keycloakInternalUrl $ }}/realms/master > /dev/null 2>&1; do
            echo "Waiting for Keycloak..."
            sleep 3
          done

  # Empty accessKey/secretKey = auto-generate (16 / 32 alphanumeric).
  readOnlyUser:
    enabled: true
    accessKey: ""
    secretKey: ""
    policy: readonly

  oidcWellKnownConfigUrl: '{{ tpl .Values.global.keycloakIssuerUrl $ }}/.well-known/openid-configuration'
  oidcClientId: openg2p-minio
  # Name of the secret in Kubernetes containing (DO NOT put password directly here)
  # Same name as client id by convention.
  oidcClientSecret: '{{ tpl .Values.oidcClientId $ }}'
  # Key containing client password. Hardcoded in Keycloak Init script
  oidcClientSecretKey: 'client_secret'

  extraEnvVars:
  - name: MINIO_IDENTITY_OPENID_CONFIG_URL
    value: '{{ tpl .Values.oidcWellKnownConfigUrl $ }}'
  - name: MINIO_IDENTITY_OPENID_CLIENT_ID
    value: '{{ tpl .Values.oidcClientId $ }}'
  - name: MINIO_IDENTITY_OPENID_DISPLAY_NAME
    value: Keycloak
  - name: MINIO_IDENTITY_OPENID_CLAIM_NAME
    value: client_roles
  - name: MINIO_IDENTITY_OPENID_SCOPES
    value: openid,profile,email
  - name: MINIO_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC
    value: "on"
  - name: MINIO_IDENTITY_OPENID_CLAIM_USERINFO
    value: "on"
  - name: MINIO_IDENTITY_OPENID_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: '{{ tpl .Values.oidcClientSecret $ }}'
        key: '{{ tpl .Values.oidcClientSecretKey $ }}'

  istio:
    enabled: true
    virtualservice:
      enabled: true
      # Console UI hostname
      host: 'minio.{{ .Values.global.baseDomain }}'
      # S3 API hostname
      apiHost: 'minio-api.{{ .Values.global.baseDomain }}'
      gateway: "internal"
      destination: '{{ include "common.names.fullname" . }}'
      # Console UI port
      destinationPort: "9001"
      # S3 API port
      apiPort: "9000"
    gateway:
      enabled: false
      host: ""
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: true
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

kafka:
  enabled: true
  heapOpts: ""
  # Sandbox defaults (single replica, replication factor 1, no persistence).
  # ──────────────────────────────────────────────────────────────────────────
  # PRODUCTION CONFIGURATION:
  #   extraConfig: |-
  #     log.retention.hours=168
  #     default.replication.factor=3
  #     offsets.topic.replication.factor=3
  #     transaction.state.log.replication.factor=3
  #     transaction.state.log.min.isr=2
  #     min.insync.replicas=2
  #     auto.create.topics.enable=true
  #     delete.topic.enable=true
  #     num.partitions=3
  #   controller:
  #     replicaCount: 3
  #     resourcesPreset: "small"   # or larger based on load
  #   broker:
  #     replicaCount: 3
  #     persistence:
  #       enabled: true
  #       size: 20Gi
  # ──────────────────────────────────────────────────────────────────────────
  extraConfig: |-
    log.retention.hours=2
    default.replication.factor=1
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    auto.create.topics.enable=true
    delete.topic.enable=true
    num.partitions=3
  controller:
    heapOpts: ""
    replicaCount: 1
    # Based on observed usage ~455Mi.
    resourcesPreset: "none"
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
  broker:
    heapOpts: ""
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
    persistence:
      enabled: false
  listeners:
    client:
      protocol: PLAINTEXT
    controller:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT
    external:
      protocol: PLAINTEXT
  service:
    ports:
      client: 9092

kafkaUi:
  enabled: true
  # kafka.nameOverride will apply here too.
  hostname: '{{ tpl .Values.global.kafkaUiHostname $ }}'

  basePath: ""

  kafkaBootstrapServers: '{{ include "common.names.fullname" .Subcharts.kafka }}:9092'

  oidcIssuerUrl: '{{ tpl .Values.global.keycloakIssuerUrl $ }}'
  oidcClientId: openg2p-kafka
  # Name of the secret in Kubernetes containing (DO NOT put password directly here)
  # Same name as client id by convention.
  oidcClientSecret: '{{ tpl .Values.kafkaUi.oidcClientId $ }}'
  # Key containing client password. Hardcoded in Keycloak Init script
  oidcClientSecretKey: 'client_secret'

  commonLabels:
    app.kubernetes.io/name: '{{ include "common.names.name" . }}-ui'
  commonAnnotations: {}
  podLabels:
    app.kubernetes.io/name: '{{ include "common.names.name" . }}-ui'
  podAnnotations: {}

  replicaCount: 1

  service:
    type: ClusterIP
    port: 80
    nodePorts:
      http: ""
      https: ""
    externalTrafficPolicy: Cluster

  image:
    repository: openg2p/kafka-ui
    tag: v0.7.2
    pullPolicy: Always
    pullSecrets: []

  containerPort: 8080

  startupProbe:
    enabled: true
    httpGet:
      path: '{{ tpl .Values.kafkaUi.basePath $ }}/actuator/health'
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1

  livenessProbe:
    enabled: true
    httpGet:
      path: '{{ tpl .Values.kafkaUi.basePath $ }}/actuator/health'
      port: 8080
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  readinessProbe:
    enabled: true
    httpGet:
      path: '{{ tpl .Values.kafkaUi.basePath $ }}/actuator/health'
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  command: []
  args: []

  hostAliases: []

  # Based on observed usage ~420Mi.
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
  javaOpts: ""

  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true

  podSecurityContext:
    enabled: false
    fsGroup: 1001

  podAffinityPreset: ""
  podAntiAffinityPreset: soft
  nodeAffinityPreset:
    type: ""
    key: ""
    values: []
  affinity: {}
  nodeSelector: {}
  tolerations: []

  priorityClassName: ""
  lifecycleHooks: {}

  updateStrategy:
    type: RollingUpdate

  initContainers: []
  sidecars: []

  extraVolumes: []
  extraVolumeMounts: []

  envVars:
    JDK_JAVA_OPTIONS: '{{ tpl .Values.kafkaUi.javaOpts $ }}'
    SERVER_SERVLET_CONTEXT_PATH: '{{ tpl .Values.kafkaUi.basePath $ }}'
    SPRING_CONFIG_ADDITIONAL-LOCATION: '/kafka-ui/config.yml'
  envVarsFrom:
    OIDC_CLIENT_SECRET:
      secretKeyRef:
        name: '{{ tpl .Values.kafkaUi.oidcClientSecret $ }}'
        key: '{{ tpl .Values.kafkaUi.oidcClientSecretKey $ }}'

  configYml: |-
    server:
      max-http-header-size: "200000"
    kafka:
      clusters:
      - name: main
        bootstrapServers: '{{ tpl .Values.kafkaUi.kafkaBootstrapServers $ }}'
    auth:
      type: OAUTH2
      oauth2:
        client:
          keycloak:
            clientId: '{{ tpl .Values.kafkaUi.oidcClientId $ }}'
            clientSecret: '${OIDC_CLIENT_SECRET}'
            scope: ["openid","profile","email"]
            authorization-grant-type: authorization_code
            redirect-uri: '{baseUrl}/login/oauth2/code/{registrationId}'
            authorization-uri: '{{ tpl .Values.global.keycloakExternalIssuerUrl $ }}/protocol/openid-connect/auth'
            token-uri: '{{ tpl .Values.kafkaUi.oidcIssuerUrl $ }}/protocol/openid-connect/token'
            jwk-set-uri: '{{ tpl .Values.kafkaUi.oidcIssuerUrl $ }}/protocol/openid-connect/certs'
            user-info-uri: '{{ tpl .Values.kafkaUi.oidcIssuerUrl $ }}/protocol/openid-connect/userinfo'
            user-name-attribute: email
            client-name: Keycloak
            provider: keycloak
            custom-params:
              type: oauth
              roles-field: client_roles
    rbac:
      roles:
        - name: "admins"
          clusters: ["main"]
          subjects:
            - provider: oauth
              type: role
              value: "Admin"
          permissions:
            - resource: applicationconfig
              actions: all
            - resource: clusterconfig
              actions: all
            - resource: topic
              value: ".*"
              actions: all
            - resource: consumer
              value: ".*"
              actions: all
            - resource: schema
              value: ".*"
              actions: all
            - resource: connect
              value: ".*"
              actions: all
            - resource: ksql
              actions: all
            - resource: acl
              actions: all

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: ""
      gateway: "internal"
      # In the following destination properties the context is root not ".Values.kafka"
      # nor ".Values.kafkaUi" unlike other subcharts (like minio)
      # because of difference in structure.
      destination: '{{ include "common.names.fullname" .Subcharts.kafka }}-ui'
      destinationPort: '{{ .Values.kafkaUi.service.port }}'
      prefix: /
      rewriteUri: ""
    gateway:
      enabled: false
      host: ""
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: true
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

keycloak:
  enabled: true
  image:
    tag: 24.0.5-debian-12-r1-g2p1
    pullPolicy: Always
  auth:
    adminUser: admin
  # Disable bundled PostgreSQL — use the shared commons PostgreSQL instance.
  postgresql:
    enabled: false
  externalDatabase:
    host: '{{ tpl .Values.global.postgresqlHost $ }}'
    port: 5432
    database: keycloak
    user: keycloakuser
    existingSecret: keycloak-db-user
    existingSecretPasswordKey: keycloak-db-user-password
  production: true
  proxy: edge
  proxyHeaders: xforwarded
  service:
    type: ClusterIP
  ingress:
    enabled: false
  extraEnvVars:
    - name: KC_HOSTNAME
      value: 'keycloak.{{ .Values.global.baseDomain }}'
    - name: KC_HOSTNAME_STRICT
      value: "false"
  replicaCount: 1
  # Based on observed usage ~922Mi. Keycloak needs generous headroom (Quarkus
  # re-augmentation uses extra memory). Do NOT set JAVA_OPTS_APPEND here —
  # it overwrites the chart's JGroups DNS discovery settings.
  # For production, increase limit to 4Gi.
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
  rbac:
    create: true
    rules:
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list"]

softhsm:
  # Required by esignet + mock-identity-system, which embed their own keymanager
  # and initialise their signing keys against this HSM (they hardcode the
  # softhsm PKCS11 socket / security-pin — no PKCS12 path in those charts).
  # NOTE: the standalone keymanager service does NOT use this — it runs with
  # keystoreType=PKCS12 (file-based .p12) and ignores softhsm entirely.
  enabled: true
  # Hardcoding this for now. else every upgrade will reset the pin
  securityPIN: MTYwMzIyMjg=
  # NOTE: the softhsm subchart bakes a 1500Mi memory limit into its own
  # values.yaml. Helm deep-merge keeps it (an empty/null override won't clear it),
  # so a limit remains here. Harmless — softhsm uses only a few MB.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
