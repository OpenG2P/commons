global:
  baseDomain: qa.openg2p.org
  keycloakBaseUrl: https://keycloak.openg2p.org
  # Internal URL for pod-to-Keycloak communication (HTTP, no TLS).
  # Set to http://keycloak.keycloak-system.svc.cluster.local for local/self-signed setups.
  # Leave empty to use keycloakBaseUrl (works when pods can reach the external HTTPS URL).
  keycloakInternalUrl: ""
  keycloakIssuerUrl: '{{ (tpl (.Values.global.keycloakInternalUrl | default .Values.global.keycloakBaseUrl) $) }}/realms/master'

  postgresqlHost: '{{ .Release.Name }}-postgresql'
  mailInstallationName: '{{ .Release.Name }}-mail'
  minioInstallationName: '{{ .Release.Name }}-minio'

  sysAdminEmail: admin@openg2p.sandbox.org
  redisInstallationName: '{{ .Release.Name }}-redis'
  redisAuthInstallationName: '{{ .Release.Name }}-redis-auth'

keycloak-init:
  enabled: true
  keycloak:
    # NOTE: keycloak-init subchart does not support tpl on this value.
    # Must be set explicitly via --set or install-base.sh.
    url: ''
    user: ''
    # Password can be passed directly (used by install-base.sh to create the secret).
    # If empty, the chart expects the existingSecret to already exist.
    password: ''
    realm: master
    existingSecret: keycloak-client-manager
    existingSecretKey: keycloak-client-manager-password
  job:
    backoffLimit: 3
    ttlSecondsAfterFinished: 600
  # Only commons-related clients. Other module clients are added by their own charts.
  clients:
    - clientId: 'openg2p-superset-{{ .suffix }}'
      name: 'Superset {{ .suffix }}'
      redirectUris: ["*"]
      clientRoles: ["Admin"]
    - clientId: 'openg2p-opensearch-{{ .suffix }}'
      name: 'OpenSearch {{ .suffix }}'
      redirectUris: ["*"]
      clientRoles: ["admin"]
    - clientId: 'openg2p-kafka-{{ .suffix }}'
      name: 'Kafka {{ .suffix }}'
      redirectUris: ["*"]
      clientRoles: ["Admin"]
    - clientId: 'openg2p-minio-{{ .suffix }}'
      name: 'MinIO {{ .suffix }}'
      redirectUris: ["*"]
      clientRoles: ["consoleAdmin"]
    - clientId: 'openg2p-odk-{{ .suffix }}'
      name: 'ODK {{ .suffix }}'
      redirectUris: ["*"]

postgresql:
  enabled: true
  auth:
    postgresPassword: ""
  additionalDbs:
    enabled: false
  primary:
    extendedConfiguration: |-
      wal_level = logical
      max_wal_senders = 20
      max_replication_slots = 300
      max_connections = 500
    # Defaul resources is set to "nano" in original Helm chart. We don't set any limit here
    # and let postgresql consume any amount of resources. Later we can limit it
    resourcesPreset: "none"
    extraEnvVars:
      - name: POSTGRES_POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: '{{ include "postgresql.v1.primary.fullname" . }}'
            key: postgres-password
  istio:
    enabled: false
    virtualservice:
      enabled: true
      host: "*"
      gateway: ""
      matchPort: 5432
      destination: '{{ include "postgresql.v1.primary.fullname" . }}'
      destinationPort: "5432"
    gateway:
      enabled: true
      port: 5432
      host: "*"
      ingressController:
        istio: ingressgateway
      tls:
        enabled: false
        mode: SIMPLE
        credentialName: ""

postgres-init:
  enabled: true
  # NO hook annotations — runs as a regular Job.
  # postgres-init has built-in pg_isready loops to wait for PostgreSQL.
  postgresql:
    host: '{{ tpl .Values.global.postgresqlHost $ }}'
    port: 5432
    existingSecret: '{{ .Release.Name }}-postgresql'
    existingSecretPostgresPasswordKey: postgres-password
  databases:
    # We are creating the following databases as the respective charts don't create on their own.
    # Note that Keymanager creates DB on its own.
    - name: superset
      # As expected by Superset chart
      user: superset
      secret: superset-db-user
      secretUserPasswordKey: superset-db-user-password
    - name: odkdb
      user: odkuser
      secret: odk-db-user
      secretUserPasswordKey: odk-db-user-password
    - name: mosip_keymgr
      user: keymgruser
      secret: keymgr-db-user
      secretUserPasswordKey: keymgr-db-user-password
    - name: mosip_mockidentitysystem
      user: mockidsystemuser
      secret: mockid-db-user
      secretUserPasswordKey: mockid-db-user-password
    # Although esignet runs postgres init we are creating the DB and user
    # because we want the user password to be in a secret and not directly
    # passed
    - name: mosip_esignet
      user: esignetuser
      secret: esignet-db-user
      secretUserPasswordKey: esignet-db-user-password

mail:
  enabled: false
  mailname: admin@openg2p.sandbox.org

# Redis without auth enabled.
redis:
  # Default name of the redis service is .Release.Name-redis-master
  enabled: true
  architecture: standalone
  image:
    registry: docker.io
    repository: openg2p/redis
    tag: 7.2.5-debian-12-r4
  auth:
    enabled: false
  master:
    resourcesPreset: none
    persistence:
      enabled: false

# Redis with authentication enabled required by services like eSignet
redis-auth:
  enabled: true
  # We override the name here
  nameOverride: "redis-auth"
  architecture: standalone
  image:
    registry: docker.io
    repository: openg2p/redis
    tag: 7.2.5-debian-12-r4
  auth:
    enabled: true
  master:
    resourcesPreset: none
    persistence:
      enabled: false

minio:
  enabled: true
  hostname: 'minio.{{ .Values.global.baseDomain }}'
  persistence:
    enabled: true
    size: 16Gi

  oidcWellKnownConfigUrl: '{{ tpl .Values.global.keycloakIssuerUrl $ }}/.well-known/openid-configuration'
  # Default
  oidcClientId: 'openg2p-minio-{{ .Release.Namespace }}'
  # Name of the secret in Kuberentes containing (DO NOT password directly here)
  # Same name as client id by convention.
  oidcClientSecret: '{{ tpl .Values.oidcClientId $ }}'
  # Key containing client password. Hardcoded in Keycloak Init script
  oidcClientSecretKey: 'client_secret'

  extraEnvVars:
  - name: MINIO_IDENTITY_OPENID_CONFIG_URL
    value: '{{ tpl .Values.oidcWellKnownConfigUrl $ }}'
  - name: MINIO_IDENTITY_OPENID_CLIENT_ID
    value: '{{ tpl .Values.oidcClientId $ }}'
  - name: MINIO_IDENTITY_OPENID_DISPLAY_NAME
    value: Keycloak
  - name: MINIO_IDENTITY_OPENID_CLAIM_NAME
    value: client_roles
  - name: MINIO_IDENTITY_OPENID_SCOPES
    value: openid,profile,email
  - name: MINIO_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC
    value: "on"
  - name: MINIO_IDENTITY_OPENID_CLAIM_USERINFO
    value: "on"
  - name: MINIO_IDENTITY_OPENID_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: '{{ tpl .Values.oidcClientSecret $ }}'
        key: '{{ tpl .Values.oidcClientSecretKey $ }}'

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: ""
      gateway: "internal"
      destination: '{{ include "common.names.fullname" . }}'
      destinationPort: "9001"
    gateway:
      enabled: false
      host: ""
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: true
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

opensearch:
  enabled: true
  hostname: 'opensearch.{{ .Values.global.baseDomain }}'

  oidcWellKnownConfigUrl: '{{ tpl .Values.global.keycloakIssuerUrl $ }}/.well-known/openid-configuration'
  # Default
  oidcClientId: 'openg2p-opensearch-{{ .Release.Namespace }}'
  # Name of the secret in Kuberentes containing (DO NOT password directly here)
  # Same name as client id by convention.
  oidcClientSecret: '{{ tpl .Values.oidcClientId $ }}'
  # Key containing client password. Hardcoded in Keycloak Init script
  oidcClientSecretKey: 'client_secret'

  master:
    masterOnly: false
    persistence:
      size: 8Gi
    replicaCount: 1
    heapSize: 256m
    resourcesPreset: "none"

  data:
    replicaCount: 0

  coordinating:
    replicaCount: 0

  ingest:
    replicaCount: 0

  extraVolumes:
  - name: security-config
    configMap:
      name: '{{ include "common.names.fullname" . }}-custom-config'

  extraVolumeMounts:
  - name: security-config
    mountPath: /opt/bitnami/opensearch/config.default/opensearch-security/config.yml
    subPath: opensearch-security-config.yml

  security:
    enabled: true
    tls:
      restEncryption: true
    extraConfig: |-
      _meta:
        type: "config"
        config_version: 2
      config:
        dynamic:
          http:
            anonymous_auth_enabled: false
            xff:
              enabled: false
          authc:
            basic_internal_auth_domain:
              http_enabled: true
              transport_enabled: true
              order: 0
              description: "Authenticate via HTTP Basic against internal users database"
              http_authenticator:
                type: basic
                challenge: false
              authentication_backend:
                type: internal
            openid_auth_domain:
              http_enabled: true
              transport_enabled: true
              order: 1
              description: "Authenticate via Keycloak OIDC"
              http_authenticator:
                type: openid
                challenge: false
                config:
                  subject_key: preferred_username
                  roles_key: client_roles
                  openid_connect_url: '{{ tpl .Values.oidcWellKnownConfigUrl $ }}'
              authentication_backend:
                type: noop
            kerberos_auth_domain:
              http_enabled: false
              transport_enabled: false
            proxy_auth_domain:
              http_enabled: false
              transport_enabled: false
            jwt_auth_domain:
              http_enabled: false
              transport_enabled: false
            clientcert_auth_domain:
              http_enabled: false
              transport_enabled: false
            ldap:
              http_enabled: false
              transport_enabled: false
          authz: {}

  dashboards:
    enabled: true
    replicaCount: 1

    resourcesPreset: "none"

    extraEnvVars:
    - name: OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: '{{ tpl .Values.oidcClientSecret $ }}'
          key: '{{ tpl .Values.oidcClientSecretKey $ }}'

    extraVolumes:
    - name: dashboards-config
      configMap:
        name: '{{ include "common.names.fullname" . }}-custom-config'

    extraVolumeMounts:
    - name: dashboards-config
      mountPath: /opt/bitnami/opensearch-dashboards/config.default/opensearch_dashboards.yml
      subPath: opensearch_dashboards.yml

    extraConfig: |-
      path:
        data: /bitnami/opensearch-dashboards/data
      opensearch:
        requestHeadersAllowlist:
          - authorization
          - securitytenant
        ssl:
          verificationMode: none
      opensearch_security:
        auth:
          type:
          # - basicauth # Enable this to allow password based auth also
          - openid
          multiple_auth_enabled: true
        openid:
          connect_url: '{{ tpl .Values.oidcWellKnownConfigUrl $ }}'
          client_id: '{{ tpl .Values.oidcClientId $ }}'
          client_secret: "${OIDC_CLIENT_SECRET}"
          base_redirect_url: 'https://{{ tpl .Values.hostname $ }}'
          logout_url: ""
        ui:
          openid:
            login:
              buttonname: "Log in with Keycloak"
        multitenancy:
          enabled: false # Enable this if multi tenancy is needed.
          tenants:
            preferred:
            - Global
            - Private
        readonly_mode:
          roles:
          - kibana_read_only

  loggingOutput:
    enabled: true
    type: opensearch
    scheme: https
    host: '{{ include "common.names.fullname" . }}.{{ .Release.Namespace }}'
    port: "9200"
    user: logstash
    passwordFrom:
      secretKeyRef:
        key: logstash-password
        name: '{{ include "common.names.fullname" . }}'
    extraConfig:
      ssl_verify: false
      logstash_format: true
      suppress_type_name: true
      buffer:
        flush_interval: 10s
        flush_mode: interval

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: ""
      gateway: "internal"
      destination: '{{ include "common.names.fullname" . }}-dashboards'
      destinationPort: "5601"
    gateway:
      enabled: false
      host: ""
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: true
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

kafka:
  enabled: true
  heapOpts: ""
  extraConfig: |-
    log.retention.hours=2
    default.replication.factor=1
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    auto.create.topics.enable=true
    delete.topic.enable=true
    num.partitions=3
  controller:
    heapOpts: ""
    replicaCount: 1
    resourcesPreset: "none"
  broker:
    heapOpts: ""
    persistence:
      enabled: false
  listeners:
    client:
      protocol: PLAINTEXT
    controller:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT
    external:
      protocol: PLAINTEXT
  service:
    ports:
      client: 9092

kafkaUi:
  enabled: true
  # kafka.nameOverride will apply here too.
  hostname: 'kafka.{{ .Values.global.baseDomain }}'

  basePath: ""

  kafkaBootstrapServers: '{{ include "common.names.fullname" .Subcharts.kafka }}:9092'
  debeziumAddress: '{{ .Release.Name }}-reporting-debezium'
  opensearchKafkaConnectorAddress: '{{ .Release.Name }}-reporting-os-kafka-connector'

  oidcIssuerUrl: '{{ tpl .Values.global.keycloakIssuerUrl $ }}'
  # Default name
  oidcClientId: 'openg2p-kafka-{{ .Release.Namespace }}'
  # Name of the secret in Kubernetes containing (DO NOT put password directly here)
  # Same name as client id by convention.
  oidcClientSecret: '{{ tpl .Values.kafkaUi.oidcClientId $ }}'
  # Key containing client password. Hardcoded in Keycloak Init script
  oidcClientSecretKey: 'client_secret'

  commonLabels:
    app.kubernetes.io/name: '{{ include "common.names.name" . }}-ui'
  commonAnnotations: {}
  podLabels:
    app.kubernetes.io/name: '{{ include "common.names.name" . }}-ui'
  podAnnotations: {}

  replicaCount: 1

  service:
    type: ClusterIP
    port: 80
    nodePorts:
      http: ""
      https: ""
    externalTrafficPolicy: Cluster

  image:
    repository: openg2p/kafka-ui
    tag: v0.7.2
    pullPolicy: Always
    pullSecrets: []

  containerPort: 8080

  startupProbe:
    enabled: true
    httpGet:
      path: '{{ tpl .Values.kafkaUi.basePath $ }}/actuator/health'
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1

  livenessProbe:
    enabled: true
    httpGet:
      path: '{{ tpl .Values.kafkaUi.basePath $ }}/actuator/health'
      port: 8080
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  readinessProbe:
    enabled: true
    httpGet:
      path: '{{ tpl .Values.kafkaUi.basePath $ }}/actuator/health'
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  command: []
  args: []

  hostAliases: []

  resources: {}
  # javaOpts: "-Xms256M -Xmx2G"
  javaOpts: ""

  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true

  podSecurityContext:
    enabled: false
    fsGroup: 1001

  podAffinityPreset: ""
  podAntiAffinityPreset: soft
  nodeAffinityPreset:
    type: ""
    key: ""
    values: []
  affinity: {}
  nodeSelector: {}
  tolerations: []

  priorityClassName: ""
  lifecycleHooks: {}

  updateStrategy:
    type: RollingUpdate

  initContainers: []
  sidecars: []

  extraVolumes: []
  extraVolumeMounts: []

  envVars:
    JDK_JAVA_OPTIONS: '{{ tpl .Values.kafkaUi.javaOpts $ }}'
    SERVER_SERVLET_CONTEXT_PATH: '{{ tpl .Values.kafkaUi.basePath $ }}'
    SPRING_CONFIG_ADDITIONAL-LOCATION: '/kafka-ui/config.yml'
  envVarsFrom:
    OIDC_CLIENT_SECRET:
      secretKeyRef:
        name: '{{ tpl .Values.kafkaUi.oidcClientSecret $ }}'
        key: '{{ tpl .Values.kafkaUi.oidcClientSecretKey $ }}'

  configYml: |-
    server:
      max-http-header-size: "200000"
    kafka:
      clusters:
      - name: main
        bootstrapServers: '{{ tpl .Values.kafkaUi.kafkaBootstrapServers $ }}'
        kafkaConnect:
        - name: debezium
          address: 'http://{{ tpl .Values.kafkaUi.debeziumAddress $ }}'
        - name: opensearch-kafka-connector
          address: 'http://{{ tpl .Values.kafkaUi.opensearchKafkaConnectorAddress $ }}'
    auth:
      type: OAUTH2
      oauth2:
        client:
          keycloak:
            clientId: '{{ tpl .Values.kafkaUi.oidcClientId $ }}'
            clientSecret: '${OIDC_CLIENT_SECRET}'
            scope: ["openid","profile","email"]
            authorization-grant-type: authorization_code
            issuer-uri: '{{ tpl .Values.kafkaUi.oidcIssuerUrl $ }}'
            jwk-set-uri: '{{ tpl .Values.kafkaUi.oidcIssuerUrl $ }}/protocol/openid-connect/certs'
            user-name-attribute: email
            client-name: Keycloak
            provider: keycloak
            custom-params:
              type: oauth
              roles-field: client_roles
    rbac:
      roles:
        - name: "admins"
          clusters: ["main"]
          subjects:
            - provider: oauth
              type: role
              value: "Admin"
          permissions:
            - resource: applicationconfig
              actions: all
            - resource: clusterconfig
              actions: all
            - resource: topic
              value: ".*"
              actions: all
            - resource: consumer
              value: ".*"
              actions: all
            - resource: schema
              value: ".*"
              actions: all
            - resource: connect
              value: ".*"
              actions: all
            - resource: ksql
              actions: all
            - resource: acl
              actions: all

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: ""
      gateway: "internal"
      # In the following destination properties the context is root not ".Values.kafka"
      # nor ".Values.kafkaUi" unlike other subcharts (like minio and opensearch)
      # because of difference in structure.
      destination: '{{ include "common.names.fullname" .Subcharts.kafka }}-ui'
      destinationPort: '{{ .Values.kafkaUi.service.port }}'
      prefix: /
      rewriteUri: ""
    gateway:
      enabled: false
      host: ""
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: true
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

softhsm:
  enabled: true
  # Hardcoding this for now. else every upgrade will reset the pin
  securityPIN: MTYwMzIyMjg=
  resources: {}
