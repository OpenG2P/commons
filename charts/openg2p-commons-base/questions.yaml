questions:

# General
- variable: global.baseDomain
  description: >-
    Domain all hostnames sit under: each service gets <service>.<Base Domain>
    (e.g. kafka.trial.openg2p.org). Defaults to <namespace>.openg2p.org.
  type: string
  label: Base Domain
  required: true
  group: General

# Keycloak
- variable: keycloak.enabled
  description: >-
    Install Keycloak in this environment. Turn off only to use an external
    Keycloak, and then set its URL below.
  type: boolean
  label: Install Keycloak?
  group: Keycloak

- variable: global.keycloakBaseUrl
  description: >-
    URL of the external Keycloak, e.g. https://keycloak.example.org. With the
    bundled Keycloak this is https://keycloak.<Base Domain> and needs no change.
  type: string
  label: External Keycloak URL
  group: Keycloak
  show_if: keycloak.enabled=false

- variable: keycloak-init.staffAdminEmail
  description: Email of the admin user created in the staff realm.
  type: string
  label: Staff Admin Email
  group: Keycloak

# PostgreSQL
- variable: postgresql.enabled
  description: >-
    Install PostgreSQL in this environment. Turn off to use an external
    PostgreSQL server, and then set its host and superuser Secret below.
  type: boolean
  label: Install PostgreSQL?
  group: PostgreSQL

- variable: global.postgresqlHost
  description: Hostname or IP address of the external PostgreSQL server.
  type: string
  label: External PostgreSQL Host
  group: PostgreSQL
  show_if: postgresql.enabled=false

- variable: global.postgresqlSecret
  description: >-
    Kubernetes Secret holding the external server's superuser password. Create
    it in this namespace before installing.
  type: string
  label: Superuser Password Secret
  group: PostgreSQL
  show_if: postgresql.enabled=false

- variable: global.postgresqlSecretKey
  description: Key inside that Secret that holds the password.
  type: string
  label: Superuser Password Secret Key
  group: PostgreSQL
  show_if: postgresql.enabled=false

# Object store
- variable: global.garageHostname
  description: >-
    Public hostname of the S3-compatible object store API. Defaults to
    garage.<Base Domain>.
  type: string
  label: Object Store (S3) Hostname
  group: Object Store

# Kafka
- variable: kafka.enabled
  description: >-
    Install Kafka. Audit Manager and eSignet in commons-services need it.
  type: boolean
  label: Install Kafka?
  group: Kafka

- variable: kafka.controller.replicaCount
  description: >-
    Kafka nodes, each both controller and broker, with its data on a persistent
    volume. 1 for a sandbox, 3 for production (an odd number).
  type: int
  label: Kafka Nodes
  group: Kafka
  show_if: kafka.enabled=true

- variable: kafka.extraConfig
  description: >-
    Kafka server.properties overrides. For production set
    default.replication.factor=3, offsets.topic.replication.factor=3,
    transaction.state.log.replication.factor=3, transaction.state.log.min.isr=2,
    min.insync.replicas=2 and log.retention.hours=168.
  type: multiline
  label: Kafka Extra Config
  group: Kafka
  show_if: kafka.enabled=true

- variable: kafkaUi.enabled
  description: Install Kafka UI, the web console for topics and consumers.
  type: boolean
  label: Install Kafka UI?
  group: Kafka
  show_if: kafka.enabled=true

- variable: global.kafkaUiHostname
  description: Hostname of Kafka UI. Defaults to kafka.<Base Domain>.
  type: string
  label: Kafka UI Hostname
  group: Kafka
  show_if: kafkaUi.enabled=true

# Novu (notifications)
- variable: novu.enabled
  description: >-
    Install Novu, the notification service (on by default). Turn off only while a
    separate novu release is still installed in this namespace.
  type: boolean
  default: true
  label: Install Novu?
  group: Novu

- variable: global.novuApiHostname
  description: Hostname of the Novu API. Defaults to novu-api.<Base Domain>.
  type: string
  label: Novu API Hostname
  group: Novu
  show_if: novu.enabled=true

- variable: global.novuWsHostname
  description: Hostname of the Novu WebSocket service. Defaults to novu-ws.<Base Domain>.
  type: string
  label: Novu WebSocket Hostname
  group: Novu
  show_if: novu.enabled=true

- variable: global.novuDashboardHostname
  description: Hostname of the Novu dashboard. Defaults to novu.<Base Domain>.
  type: string
  label: Novu Dashboard Hostname
  group: Novu
  show_if: novu.enabled=true
