{{- if .Values.opensearch.enabled }}
{{- if .Values.opensearch.ismPolicy.enabled }}
{{- $opensearchHost := include "common.tplvalues.render" (dict "value" .Values.opensearch.loggingOutput.host "context" .Subcharts.opensearch) }}
{{- $opensearchPort := include "common.tplvalues.render" (dict "value" .Values.opensearch.loggingOutput.port "context" .Subcharts.opensearch) }}
{{- $secretName := include "common.tplvalues.render" (dict "value" .Values.opensearch.loggingOutput.passwordFrom.secretKeyRef.name "context" .Subcharts.opensearch) }}
{{- $secretKey := include "common.tplvalues.render" (dict "value" .Values.opensearch.loggingOutput.passwordFrom.secretKeyRef.key "context" .Subcharts.opensearch) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-opensearch-ism-policy-{{ .Release.Revision }}
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch-ism-policy
        app.kubernetes.io/instance: {{ .Release.Name }}
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: apply-ism-policy
          image: "docker.io/curlimages/curl:8.7.1"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              OS_URL="https://{{ $opensearchHost }}:{{ $opensearchPort }}"
              POLICY_ID="logs_retention"
              INDEX_PATTERN="{{ .Values.opensearch.ismPolicy.indexPattern }}"

              echo "Waiting for OpenSearch cluster to be ready..."
              for i in $(seq 1 60); do
                STATUS=$(curl -sfk -u "${OS_USER}:${OS_PASSWORD}" \
                  "${OS_URL}/_cluster/health?wait_for_status=yellow&timeout=5s" \
                  | grep -o '"status":"[^"]*"' | head -1) && \
                  [ -n "$STATUS" ] && echo "Cluster health: $STATUS" && break
                echo "  Attempt $i/60 - waiting..."
                sleep 10
              done

              echo "Applying ISM policy '${POLICY_ID}'..."
              HTTP_CODE=$(curl -sfk -o /tmp/response.json -w "%{http_code}" \
                -u "${OS_USER}:${OS_PASSWORD}" \
                -X PUT "${OS_URL}/_plugins/_ism/policies/${POLICY_ID}" \
                -H "Content-Type: application/json" \
                -d @/config/policy.json)

              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
                echo "ISM policy created/updated successfully."
              else
                echo "ISM policy PUT returned HTTP $HTTP_CODE:"
                cat /tmp/response.json
                # 409 = policy already exists with same seq_no — safe to continue
                [ "$HTTP_CODE" = "409" ] && echo "Policy already exists (OK)." || exit 1
              fi

              echo "Attaching policy to existing '${INDEX_PATTERN}' indexes..."
              curl -sfk -u "${OS_USER}:${OS_PASSWORD}" \
                -X POST "${OS_URL}/_plugins/_ism/add/${INDEX_PATTERN}" \
                -H "Content-Type: application/json" \
                -d "{\"policy_id\": \"${POLICY_ID}\"}" || true

              echo "Done. ISM policy '${POLICY_ID}' applied."
          env:
            - name: OS_USER
              value: {{ .Values.opensearch.loggingOutput.user | quote }}
            - name: OS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $secretKey }}
          volumeMounts:
            - name: policy
              mountPath: /config
              readOnly: true
      volumes:
        - name: policy
          configMap:
            name: {{ .Release.Name }}-opensearch-ism-policy
{{- end }}
{{- end }}
