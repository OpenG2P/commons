{{- if .Values.keycloak.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: {{ .Release.Name }}-keycloak
spec:
  selector:
    istio: ingressgateway
  servers:
    - hosts:
        - 'keycloak.{{ .Values.global.baseDomain }}'
      port:
        name: http2
        number: 8080
        protocol: HTTP2
{{- end }}
