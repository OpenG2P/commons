{{- if .Values.novu.enabled }}
{{- $secretName := include "openg2pCommon.novu.secret" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-novu-worker
spec:
  ports:
    - name: http
      port: 3004
      targetPort: http
  selector:
    app.kubernetes.io/name: novu-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-novu-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: novu-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: novu-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ $secretName }}
      containers:
        - name: novu-worker
          image: {{ .Values.novu.worker.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3004
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3004"
            - name: API_ROOT_URL
              value: http://{{ .Release.Name }}-novu-api:3000
            - name: IS_SELF_HOSTED
              value: "true"
            - name: REDIS_DB_INDEX
              value: "2"
            - name: REDIS_HOST
              value: {{ include "openg2pCommon.novu.redisHost" . | quote }}
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_CACHE_SERVICE_HOST
              value: {{ include "openg2pCommon.novu.redisHost" . | quote }}
            - name: REDIS_CACHE_SERVICE_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openg2pCommon.novu.redisSecret" . }}
                  key: redis-password
            - name: REDIS_CACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openg2pCommon.novu.redisSecret" . }}
                  key: redis-password
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: mongo-url
            - name: STORE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: store-encryption-key
            - name: S3_LOCAL_STACK
              value: {{ tpl .Values.novu.s3.endpoint $ | quote }}
            - name: S3_BUCKET_NAME
              value: {{ .Values.novu.s3.bucket | quote }}
            - name: S3_REGION
              value: {{ .Values.novu.s3.region | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.novu.s3.existingSecret $ }}
                  key: {{ .Values.novu.s3.accessKeyKey }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.novu.s3.existingSecret $ }}
                  key: {{ .Values.novu.s3.secretKeyKey }}
          readinessProbe:
            httpGet:
              path: /v1/health-check
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
{{- end }}
