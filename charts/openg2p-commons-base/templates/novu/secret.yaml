{{- if .Values.novu.enabled }}
{{- $secretName := include "openg2pCommon.novu.secret" . }}
{{- $mongoPassB64 := include "common.secrets.passwords.manage" (dict "secret" $secretName "key" "mongodb-password" "providedValues" (list "novu.mongodb.password") "length" 16 "strong" false "skipQuote" true "context" $) | trim }}
{{- $mongoPass := $mongoPassB64 | b64dec }}
{{- $mongoHost := printf "%s-novu-mongodb" .Release.Name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
type: Opaque
data:
  jwt-secret: {{ include "common.secrets.passwords.manage" (dict "secret" $secretName "key" "jwt-secret" "providedValues" (list "novu.jwtSecret") "length" 32 "strong" false "context" $) }}
  store-encryption-key: {{ include "common.secrets.passwords.manage" (dict "secret" $secretName "key" "store-encryption-key" "providedValues" (list "novu.storeEncryptionKey") "length" 32 "strong" false "context" $) }}
  novu-secret-key: {{ include "common.secrets.passwords.manage" (dict "secret" $secretName "key" "novu-secret-key" "providedValues" (list "novu.novuSecretKey") "length" 32 "strong" false "context" $) }}
  mongodb-root-password: {{ include "common.secrets.passwords.manage" (dict "secret" $secretName "key" "mongodb-root-password" "providedValues" (list "novu.mongodb.rootPassword") "length" 16 "strong" false "context" $) }}
  mongodb-password: {{ $mongoPassB64 | quote }}
  mongo-url: {{ printf "mongodb://%s:%s@%s:27017/%s?authSource=%s" .Values.novu.mongodb.username $mongoPass $mongoHost .Values.novu.mongodb.database .Values.novu.mongodb.database | b64enc | quote }}
  admin-email: {{ .Values.novu.bootstrap.email | b64enc | quote }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
  {{- $existingData := dict }}
  {{- if $existing }}
  {{- $existingData = $existing.data | default dict }}
  {{- end }}
  {{- $adminPassword := "" }}
  {{- if index $existingData "admin-password" }}
  {{- $adminPassword = index $existingData "admin-password" | b64dec }}
  {{- else }}
  {{- $generated := include "common.secrets.passwords.manage" (dict "secret" $secretName "key" "admin-password" "providedValues" (list "novu.bootstrap.password") "length" 16 "strong" false "skipQuote" true "context" $) | trim | b64dec }}
  {{- if .Values.novu.bootstrap.password }}
  {{- $adminPassword = $generated }}
  {{- else }}
  {{- $adminPassword = printf "%sAa1!" $generated }}
  {{- end }}
  {{- end }}
  admin-password: {{ $adminPassword | b64enc | quote }}
  {{- $apiKey := .Values.novu.notificationApiKey }}
  {{- if and (not $apiKey) (index $existingData "api-key") }}
  {{- $apiKey = index $existingData "api-key" | b64dec }}
  {{- end }}
  {{- if $apiKey }}
  api-key: {{ $apiKey | b64enc | quote }}
  {{- end }}
{{- end }}
