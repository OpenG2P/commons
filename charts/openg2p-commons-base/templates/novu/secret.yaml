{{- if .Values.novu.enabled }}
{{- $secretName := printf "%s-novu" .Release.Name }}
{{- $novu := .Subcharts.novu }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
type: Opaque
data:
  jwt-secret: {{ include "common.secrets.passwords.manage" (dict "secret" $secretName "key" "jwt-secret" "providedValues" (list "jwt.secret") "length" 32 "strong" false "context" $novu) }}
  store-encryption-key: {{ include "common.secrets.passwords.manage" (dict "secret" $secretName "key" "store-encryption-key" "providedValues" (list "store.encryption-key") "length" 32 "strong" false "context" $novu) }}
  novu-secret-key: {{ include "common.secrets.passwords.manage" (dict "secret" $secretName "key" "novu-secret-key" "providedValues" (list "api.env.NOVU_SECRET_KEY") "length" 32 "strong" false "context" $novu) }}
  admin-email: {{ .Values.novu.bootstrap.email | b64enc | quote }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
  {{- $existingData := dict }}
  {{- if $existing }}
  {{- $existingData = $existing.data | default dict }}
  {{- end }}
  {{- $adminPassword := "" }}
  {{- if index $existingData "admin-password" }}
  {{- $adminPassword = index $existingData "admin-password" | b64dec }}
  {{- else }}
  {{- $generated := include "common.secrets.passwords.manage" (dict "secret" $secretName "key" "admin-password" "providedValues" (list "bootstrap.password") "length" 16 "strong" false "skipQuote" true "context" $novu) | trim | b64dec }}
  {{- if .Values.novu.bootstrap.password }}
  {{- $adminPassword = $generated }}
  {{- else }}
  {{- $adminPassword = printf "%sAa1!" $generated }}
  {{- end }}
  {{- end }}
  admin-password: {{ $adminPassword | b64enc | quote }}
  {{- $apiKey := .Values.novu.notificationApiKey }}
  {{- if and (not $apiKey) (index $existingData "api-key") }}
  {{- $apiKey = index $existingData "api-key" | b64dec }}
  {{- end }}
  {{- if $apiKey }}
  api-key: {{ $apiKey | b64enc | quote }}
  {{- end }}
{{- end }}
