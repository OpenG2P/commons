{{- if .Values.novu.enabled }}
{{- $secretName := include "openg2pCommon.novu.secret" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-novu-ws
spec:
  ports:
    - name: http
      port: 3002
      targetPort: http
  selector:
    app.kubernetes.io/name: novu-ws
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-novu-ws
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: novu-ws
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: novu-ws
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ $secretName }}
      containers:
        - name: novu-ws
          image: {{ .Values.novu.ws.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3002"
            - name: REDIS_HOST
              value: {{ include "openg2pCommon.novu.redisHost" . | quote }}
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openg2pCommon.novu.redisSecret" . }}
                  key: redis-password
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: mongo-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /v1/health-check
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
{{- end }}
