{{- if .Values.novu.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-novu-dashboard
spec:
  ports:
    - name: http
      port: 4000
      targetPort: http
  selector:
    app.kubernetes.io/name: novu-dashboard
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-novu-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: novu-dashboard
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: novu-dashboard
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "openg2pCommon.novu.secret" . }}
      containers:
        - name: novu-dashboard
          image: {{ .Values.novu.dashboard.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: VITE_API_HOSTNAME
              value: {{ tpl .Values.novu.dashboard.apiExternalEndpoint $ | quote }}
            - name: VITE_WEBSOCKET_HOSTNAME
              value: {{ tpl .Values.novu.dashboard.wsExternalEndpoint $ | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
{{- end }}
