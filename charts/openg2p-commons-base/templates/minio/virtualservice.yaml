{{- if .Values.minio.enabled }}
{{- if .Values.minio.istio.enabled }}
{{- if .Values.minio.istio.virtualservice.enabled }}
{{- $istioVsHostname := include "common.tplvalues.render" (dict "value" .Values.minio.istio.virtualservice.host "context" .Subcharts.minio) }}
{{- $mainHostname := include "common.tplvalues.render" (dict "value" .Values.minio.hostname "context" .Subcharts.minio) }}
{{- $hostname := default $mainHostname $istioVsHostname }}
{{- $destination := include "common.tplvalues.render" (dict "value" .Values.minio.istio.virtualservice.destination "context" .Subcharts.minio) }}
{{- $consolePort := include "common.tplvalues.render" (dict "value" .Values.minio.istio.virtualservice.destinationPort "context" .Subcharts.minio) }}
{{- $apiPort := include "common.tplvalues.render" (dict "value" (.Values.minio.istio.virtualservice.apiPort | default "9000") "context" .Subcharts.minio) }}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ include "common.names.fullname" .Subcharts.minio }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.minio.commonLabels "context" .Subcharts.minio) | nindent 4 }}
  {{- if .Values.minio.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.minio.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  hosts:
  - {{ $hostname | quote }}
  gateways:
  - {{ default (include "common.names.fullname" .Subcharts.minio) .Values.minio.istio.virtualservice.gateway }}
  http:
  # MinIO S3 API (under /api/ prefix)
  - match:
    - uri:
        prefix: /api/
    headers:
      request:
        set:
          x-forwarded-host: {{ $hostname | quote }}
          x-forwarded-proto: https
    route:
    - destination:
        host: {{ $destination }}
        port:
          number: {{ $apiPort }}
  # MinIO Console UI (default route)
  - headers:
      request:
        set:
          x-forwarded-host: {{ $hostname | quote }}
          x-forwarded-proto: https
    route:
    - destination:
        host: {{ $destination }}
        port:
          number: {{ $consolePort }}
{{- end }}
{{- end }}
{{- end }}
