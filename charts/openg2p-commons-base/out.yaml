      baseDomain: trial.openg2p.org
      keycloakBaseUrl: https://keycloak.{{ .Values.global.baseDomain }}
      keycloakExternalIssuerUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/{{
        tpl .Values.global.keycloakRealm $ }}'
      keycloakInternalUrl: http://{{ .Release.Name }}-keycloak:80
      keycloakIssuerUrl: '{{ (tpl (.Values.global.keycloakInternalUrl | default .Values.global.keycloakBaseUrl)
        $) }}/realms/{{ tpl .Values.global.keycloakRealm $ }}'
      keycloakRealm: staff-{{ .Release.Namespace }}
      mailInstallationName: '{{ .Release.Name }}-mail'
      minioInstallationName: '{{ .Release.Name }}-minio'
      postgresqlHost: '{{ .Release.Name }}-postgresql'
      redisAuthInstallationName: '{{ .Release.Name }}-redis-auth'
      redisInstallationName: '{{ .Release.Name }}-redis'
      sysAdminEmail: admin@openg2p.sandbox.org
  commonAnnotations: {}
  configuration: |-
    # SoftHSM v2 configuration file
    directories.tokendir = /softhsm/tokens/
    objectstore.backend = file
    # ERROR, WARNING, INFO, DEBUG
    log.level = ERROR
    # If CKF_REMOVABLE_DEVICE flag should be set
    slots.removable = false
    # Enable and disable PKCS#11 mechanisms using slots.mechanisms.
    slots.mechanisms = ALL
    # If the library should reset the state on fork
    library.reset_on_fork = false
  containerPort: 5666
  containerSecurityContext: {}
  enabled: true
  fullnameOverride: ""
  global:
    baseDomain: trial.openg2p.org
    keycloakBaseUrl: https://keycloak.{{ .Values.global.baseDomain }}
    keycloakExternalIssuerUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/{{
      tpl .Values.global.keycloakRealm $ }}'
    keycloakInternalUrl: http://{{ .Release.Name }}-keycloak:80
    keycloakIssuerUrl: '{{ (tpl (.Values.global.keycloakInternalUrl | default .Values.global.keycloakBaseUrl)
      $) }}/realms/{{ tpl .Values.global.keycloakRealm $ }}'
    keycloakRealm: staff-{{ .Release.Namespace }}
    mailInstallationName: '{{ .Release.Name }}-mail'
    minioInstallationName: '{{ .Release.Name }}-minio'
    postgresqlHost: '{{ .Release.Name }}-postgresql'
    redisAuthInstallationName: '{{ .Release.Name }}-redis-auth'
    redisInstallationName: '{{ .Release.Name }}-redis'
    sysAdminEmail: admin@openg2p.sandbox.org
  image:
    pullPolicy: Always
    repository: mosipid/softhsm
    tag: v2
  imagePullSecrets: []
