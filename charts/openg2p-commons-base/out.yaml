    accessModes:
    - ReadWriteOnce
    enabled: true
    mountDir: /softhsm
    size: 10M
  podAnnotations: {}
  podSecurityContext:
    enabled: true
    fsGroup: 3001
    runAsGroup: 2001
    runAsUser: 1001
