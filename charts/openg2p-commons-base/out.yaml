        app.kubernetes.io/component: master
        ## Istio Labels: https://istio.io/docs/ops/deployment/requirements/
        app: master
      annotations:
        checksum/tls: d4aaf97959c8558f0c5cda2ae38c06645ae8c0eb78214f53d7e4d1fb97dae47c
    spec:
      serviceAccountName: default
      
      automountServiceAccountToken: false
      affinity:
        podAffinity:
          
        podAntiAffinity:
          
        nodeAffinity:
          
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: Always
        supplementalGroups: []
        sysctls: []
      initContainers:
        ## Image that performs the sysctl operation to modify Kernel settings (needed sometimes to avoid boot errors)
        - name: sysctl
          image: docker.io/openg2p/os-shell:12-debian-12-r27
          imagePullPolicy: "IfNotPresent"
          command:
            - /bin/bash
            - -ec
            - |
                      CURRENT=`sysctl -n vm.max_map_count`;
                      DESIRED="262144";
                      if [ "$DESIRED" -gt "$CURRENT" ]; then
                          sysctl -w vm.max_map_count=262144;
                      fi;
                      CURRENT=`sysctl -n fs.file-max`;
                      DESIRED="65536";
                      if [ "$DESIRED" -gt "$CURRENT" ]; then
                          sysctl -w fs.file-max=65536;
                      fi;
          securityContext:
            privileged: true
            runAsUser: 0
          resources:
                    limits:
                      cpu: 150m
                      ephemeral-storage: 2Gi
                      memory: 192Mi
                    requests:
                      cpu: 100m
                      ephemeral-storage: 50Mi
                      memory: 128Mi
        
        - name: copy-default-plugins
          image: docker.io/openg2p/opensearch:2.14.0-debian-12-r1
          imagePullPolicy: "IfNotPresent"
          securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                      - ALL
                    privileged: false
                    readOnlyRootFilesystem: true
                    runAsGroup: 1001
                    runAsNonRoot: true
                    runAsUser: 1001
                    seccompProfile:
                      type: RuntimeDefault
          command:
            - /bin/bash
          args:
            - -ec
            - |
                #!/bin/bash
        
                . /opt/bitnami/scripts/libfs.sh
                . /opt/bitnami/scripts/opensearch-env.sh
        
                if ! is_dir_empty "$DB_DEFAULT_PLUGINS_DIR"; then
                    cp -nr "$DB_DEFAULT_PLUGINS_DIR"/* /plugins
                fi
          volumeMounts:
            - name: empty-dir
              mountPath: /plugins
              subPath: app-plugins-dir
      containers:
        - name: opensearch
          image: docker.io/openg2p/opensearch:2.14.0-debian-12-r1
          imagePullPolicy: "IfNotPresent"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          command:
            - bash
            - -ec
            - |
              if [[ "$MY_POD_NAME" =~ -0$ ]]; then
                export OPENSEARCH_SECURITY_BOOTSTRAP=true
                # Opensearch securityadmin.sh requires the admin.key to be in PKCS8 format
                openssl pkcs8 -topk8 -nocrypt -in "/opt/bitnami/opensearch/config/certs/admin.key" > "/opt/bitnami/opensearch/config/admin.key"
                export OPENSEARCH_SECURITY_ADMIN_KEY_LOCATION="/opt/bitnami/opensearch/config/admin.key"
              fi
              /opt/bitnami/scripts/opensearch/entrypoint.sh /opt/bitnami/scripts/opensearch/run.sh
          env:
