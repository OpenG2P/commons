      echo "WARN: Could not fetch secret for ${CLIENT_ID} after retries. Skipping."
      ERRORS=$((ERRORS+1))
    fi

    if [ $ERRORS -gt 0 ]; then
      echo "Completed with ${ERRORS} warning(s)."
    else
      echo "All client secrets synced successfully."
    fi

    # Restart deployments that use OIDC client secrets so they pick up patched values
    echo "Restarting affected deployments..."
    RESTART_PATCH="{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"client-secrets-sync/restartedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}}}}"
    DEPLOYMENTS="commons-superset commons-superset-worker"
    for DEPLOY in $DEPLOYMENTS; do
      echo "Restarting deployment ${DEPLOY}..."
      curl -sf --cacert "${CA_CERT}" \
        -X PATCH \
        -H "Authorization: Bearer ${SA_TOKEN}" \
        -H "Content-Type: application/strategic-merge-patch+json" \
        -d "${RESTART_PATCH}" \
        "${K8S_API}/apis/apps/v1/namespaces/${NAMESPACE}/deployments/${DEPLOY}" > /dev/null 2>&1 \
        && echo "Restarted ${DEPLOY}" \
        || echo "WARN: Could not restart ${DEPLOY} (may not exist yet)"
    done
    echo "Done."
---
