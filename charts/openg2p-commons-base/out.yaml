      clusters:
      - name: main
        bootstrapServers: '{{ tpl .Values.kafkaUi.kafkaBootstrapServers $ }}'
        kafkaConnect:
        - name: debezium
          address: 'http://{{ tpl .Values.kafkaUi.debeziumAddress $ }}'
        - name: opensearch-kafka-connector
          address: 'http://{{ tpl .Values.kafkaUi.opensearchKafkaConnectorAddress $ }}'
    auth:
      type: OAUTH2
      oauth2:
        client:
          keycloak:
            clientId: '{{ tpl .Values.kafkaUi.oidcClientId $ }}'
            clientSecret: '${OIDC_CLIENT_SECRET}'
            scope: ["openid","profile","email"]
            authorization-grant-type: authorization_code
            redirect-uri: '{baseUrl}/login/oauth2/code/{registrationId}'
            authorization-uri: '{{ tpl .Values.global.keycloakExternalIssuerUrl $ }}/protocol/openid-connect/auth'
            token-uri: '{{ tpl .Values.kafkaUi.oidcIssuerUrl $ }}/protocol/openid-connect/token'
            jwk-set-uri: '{{ tpl .Values.kafkaUi.oidcIssuerUrl $ }}/protocol/openid-connect/certs'
            user-info-uri: '{{ tpl .Values.kafkaUi.oidcIssuerUrl $ }}/protocol/openid-connect/userinfo'
            user-name-attribute: email
            client-name: Keycloak
            provider: keycloak
            custom-params:
              type: oauth
              roles-field: client_roles
