apiVersion: batch/v1
kind: Job
metadata:
  name: commons-client-secrets-sync-1
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: commons-client-secrets-sync
      restartPolicy: OnFailure
      containers:
        - name: sync
          image: "docker.io/alpine:3.20"
          command: ["/bin/sh", "-c", "apk add --no-cache curl jq > /dev/null 2>&1 && sh /scripts/sync.sh"]
          env:
            - name: KEYCLOAK_URL
              value: "http://commons-keycloak:80"
            - name: KEYCLOAK_USER
              value: "admin"
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commons-keycloak
                  key: admin-password
            - name: NAMESPACE
              value: "trial"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: commons-client-secrets-sync
