    enabled: true
    failureThreshold: 6
    initialDelaySeconds: 30
    periodSeconds: 30
    successThreshold: 1
    tcpSocket:
      port: tcp
    timeoutSeconds: 5
  nameOverride: ""
  nodeSelector: {}
