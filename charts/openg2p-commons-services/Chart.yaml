apiVersion: v2
name: openg2p-commons-services
description: Helm chart for OpenG2P Commons application services
type: application
version: 0.0.0-develop
dependencies:
- name: openg2p-master-data
  version: 0.0.0-develop.68
  repository: https://openg2p.github.io/openg2p-helm
  condition: masterData.enabled
  alias: masterData
- name: artifactory
  version: 12.0.3
  repository: https://openg2p.github.io/openg2p-helm
  condition: artifactory.enabled
- name: keymanager
  version: 12.1.1
  repository: https://openg2p.github.io/openg2p-helm
  condition: keymanager.enabled
- name: superset
  version: 0.12.11
  repository: https://apache.github.io/superset
  condition: superset.enabled
- name: esignet
  version: 1.4.3
  repository: https://openg2p.github.io/openg2p-helm
  condition: esignet.enabled
- name: mock-identity-system
  version: 0.0.0-develop.7
  repository: https://openg2p.github.io/openg2p-helm
  condition: mock-identity-system.enabled
- name: odk-central
  version: v2025.2.2
  repository: https://openg2p.github.io/openg2p-helm
  condition: odk-central.enabled
- name: openg2p-iam-service
  version: 0.0.0-develop.97
  repository: https://openg2p.github.io/openg2p-helm
  condition: openg2p-iam-service.enabled
- name: openg2p-inji-certify
  version: 0.0.0-develop.16
  repository: https://openg2p.github.io/openg2p-helm
  condition: openg2p-inji-certify.enabled
- name: openg2p-inji-verify
  version: 0.0.0-develop.16
  repository: https://openg2p.github.io/openg2p-helm
  condition: openg2p-inji-verify.enabled
- name: openg2p-audit-manager
  version: 0.0.0-develop.25
  repository: https://openg2p.github.io/openg2p-helm
  condition: openg2p-audit-manager.enabled
- name: openg2p-staff-portal-ui
  version: 0.0.0-develop.63
  repository: https://openg2p.github.io/openg2p-helm
  condition: openg2p-staff-portal-ui.enabled
- name: openg2p-awe
  version: 0.0.0-develop.78
  repository: https://openg2p.github.io/openg2p-helm
  condition: openg2p-awe.enabled
- name: partner-management
  version: 0.0.0-develop.24
  repository: https://openg2p.github.io/openg2p-helm
  condition: partner-management.enabled
- name: openg2p-consent-manager
  version: 0.0.0-develop.57
  repository: https://openg2p.github.io/openg2p-helm
  condition: openg2p-consent-manager.enabled
- name: keycloak-init
  version: 0.0.0-develop.60
  repository: https://openg2p.github.io/openg2p-helm
  condition: keycloak-init.enabled
icon: https://openg2p.github.io/openg2p-helm/openg2p-logo.png
annotations:
  catalog.cattle.io/display-name: "OpenG2P Commons Services"
  # Rancher locks the release name to this value. Cross-chart references
  # (e.g. global.iamServiceUrl points at commons-services-iam-staff-portal-api)
  # depend on this release name being 'commons-services'.
  catalog.cattle.io/release-name: "commons-services"
  openg2p.org/add-to-rancher: "openg2p.org/add-to-rancher"
