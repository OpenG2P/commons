{{- if .Values.garage.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-garage-init
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-garage-init
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-garage-init
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-garage-init
roleRef:
  kind: Role
  name: {{ .Release.Name }}-garage-init
  apiGroup: rbac.authorization.k8s.io
{{- end }}
