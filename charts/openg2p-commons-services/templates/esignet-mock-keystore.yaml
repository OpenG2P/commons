{{- /*
  PKCS12 keystores for eSignet and mock-identity-system.

  These two used to key off the shared SoftHSM in commons-base. That coupled two
  stores with different lifecycles: their databases are dropped and recreated on
  every commons-services install (postgres-init), while the SoftHSM token lived
  in commons-base and never reset. An empty key_alias table plus a populated
  token meant keymanager minted fresh keys beside the stale ones until two
  collided, and both services crash-looped on:

      invalid KeyStore state: found multiple secret keys sharing same CKA_LABEL

  Giving each service its own file keystore, created and destroyed with THIS
  release, removes that class of failure: the keystore and the key_alias rows it
  indexes now share one lifecycle. It is also the pattern the standalone
  keymanager service already uses (keystoreType=PKCS12, no SoftHSM).

  The password is managed, not regenerated: common.secrets.passwords.manage
  reuses the value already in the cluster and only generates one on first
  install. Regenerating it on upgrade would make the existing .p12 unreadable.
*/ -}}
{{- range $svc := list "esignet" "mock-identity-system" }}
{{- $cfg := index $.Values $svc }}
{{- if $cfg.enabled }}
{{- $name := printf "%s-%s-keystore" $.Release.Name $svc }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $svc }}-keystore
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  annotations:
    # The keystore password is half the identity: lose it and the .p12 beside it
    # is inert. Kept so an accidental uninstall does not destroy it silently.
    "helm.sh/resource-policy": keep
type: Opaque
data:
  p12-keystore-pass: {{ include "common.secrets.passwords.manage" (dict "secret" $name "key" "p12-keystore-pass" "length" 16 "providedValues" (list (printf "%s.p12KeystorePass" $svc)) "context" $) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $svc }}-keystore
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ $.Values.keystorePvcSize | default "64Mi" }}
---
{{- end }}
{{- end }}
