questions:

# General
- variable: global.baseDomain
  description: >-
    Domain all hostnames sit under: each service gets <service>.<Base Domain>
    (e.g. superset.trial.openg2p.org). Use the same value as in commons-base.
    Defaults to <namespace>.openg2p.org.
  type: string
  label: Base Domain
  required: true
  group: General

- variable: global.keycloakBaseUrl
  description: >-
    Public Keycloak URL. Defaults to https://keycloak.<Base Domain> (the
    Keycloak commons-base installs); change it only for an external Keycloak.
  type: string
  label: Keycloak URL
  group: General

# PostgreSQL. commons-base sets these on its own form; repeat them here only
# for an external server. In-cluster names assume the fixed 'commons' release.
- variable: global.postgresqlHost
  description: >-
    PostgreSQL host. Leave as commons-postgresql (installed by commons-base);
    change only for an external server.
  type: string
  label: PostgreSQL Host
  group: PostgreSQL

- variable: global.postgresqlSecret
  description: >-
    Kubernetes Secret holding the PostgreSQL superuser password. Leave as is for
    the commons-base PostgreSQL; for an external server, the Secret you created.
  type: string
  label: Superuser Password Secret
  group: PostgreSQL

- variable: global.postgresqlSecretKey
  description: Key inside that Secret that holds the password.
  type: string
  label: Superuser Password Secret Key
  group: PostgreSQL

# Staff Portal
- variable: openg2p-staff-portal-ui.enabled
  description: Install the Staff Portal UI, the staff home page for all OpenG2P apps.
  type: boolean
  label: Install Staff Portal UI?
  group: Staff Portal

- variable: global.staffPortalHostname
  description: Hostname of the Staff Portal UI. Defaults to staff-portal.<Base Domain>.
  type: string
  label: Staff Portal Hostname
  group: Staff Portal

- variable: global.staffPortalApiHostname
  description: >-
    Hostname of the staff login API (IAM). Defaults to staff-iam.<Base Domain>.
    Also registered as the Keycloak staff-portal redirect URI.
  type: string
  label: Staff Login API Hostname
  group: Staff Portal

- variable: global.staffPortalCookieDomain
  description: >-
    Cookie domain shared by the Staff Portal and the staff login API. Must be a
    parent of both hostnames. Defaults to .<Base Domain>.
  type: string
  label: Staff Portal Cookie Domain
  group: Staff Portal

# Agent Portal (served by a registry chart; its login lives here)
- variable: global.agentPortalHostname
  description: >-
    Public hostname of the registry's Agent Portal UI, where agents are sent
    back after sign-in and sign-out. Set it to the registry chart's Agent Portal
    Hostname (by default <registry release>-agent.<Base Domain>, e.g.
    fr-agent.trial.openg2p.org). If the two differ, sign-out from the Agent
    Portal breaks. Ignore if no registry uses the Agent Portal.
  type: string
  label: Agent Portal Hostname
  group: Agent Portal

# Master Data
- variable: masterData.enabled
  description: >-
    Install Master Data, the catalogue of geography and datasets for the
    registries.
  type: boolean
  label: Install Master Data?
  group: Master Data

# The country pack. This is the ONE place an environment declares which country
# it serves — registries read the geography, datasets and sample people from
# Master Data and name no country of their own. Its own group, so it is not lost
# among the Master Data service settings.
- variable: masterData.geoSeed.countryPack
  description: "Directory name of the pack to seed, from packs/ in github.com/openg2p/openg2p-data — ETH (Ethiopia) or XKM (Kamuntu, fictitious, for demos). Any other pack in that folder works; use its exact directory name. Set the same pack as the maps country pack in G2P Insights."
  type: string
  default: ETH
  label: Country Pack
  group: Country Pack
  show_if: masterData.enabled=true

- variable: masterData.geoSeed.domains
  description: "Dataset themes (sector datasets) to load on top of the core datasets, comma-separated, from the pack's domains/ folder. Defaults to 'agriculture' (crops, seasons, seed, fertiliser, pests, livestock, soil, water), which the Farmer Registry and the Crop Sown Registry need: they read these lists live from Master Data, and without them their dropdowns are empty and every coded entry is rejected. A pack without a requested domain skips it with a warning in the geo-seed Job log. Clear the field to load only the core lists."
  type: string
  default: "agriculture"
  label: Dataset Themes
  group: Country Pack
  show_if: masterData.enabled=true

- variable: masterData.geoSeed.load.codelists
  description: "Load the country's core datasets (gender, education level, water source, ...) and their semantic role tags. Registries read datasets live from Master Data, so with this off their coded dropdowns are empty."
  type: boolean
  default: true
  label: Load Datasets
  group: Country Pack
  show_if: masterData.enabled=true

- variable: masterData.geoSeed.load.samples
  description: "Load the pack's sample people — a couple of dozen, coherent with the geography and the datasets — so a fresh install shows something rather than an empty registry. Not bulk analytics data, which each registry generates for itself."
  type: boolean
  default: true
  label: Load Sample People
  group: Country Pack
  show_if: masterData.enabled=true

# ODK
- variable: odk-central.enabled
  description: Install ODK Central, for collecting data with mobile forms.
  type: boolean
  label: Install ODK Central?
  group: ODK

- variable: global.odkHostname
  description: Hostname of ODK Central. Defaults to odk.<Base Domain>.
  type: string
  label: ODK Central Hostname
  group: ODK
  show_if: odk-central.enabled=true

# Superset
- variable: superset.enabled
  description: Install Superset, for dashboards and reports.
  type: boolean
  label: Install Superset?
  group: Superset

- variable: global.supersetHostname
  description: Hostname of Superset. Defaults to superset.<Base Domain>.
  type: string
  label: Superset Hostname
  group: Superset
  show_if: superset.enabled=true

# AWE (Approval Workflow Engine)
- variable: openg2p-awe.enabled
  description: >-
    Install the shared Approval Workflow Engine. The registries' change requests
    and the Consent Manager's policy approvals go through it.
  type: boolean
  label: Install AWE?
  group: AWE

- variable: global.aweHostname
  description: >-
    Hostname of AWE. Defaults to awe.<Base Domain>, which is also what the
    registries call by default.
  type: string
  label: AWE Hostname
  group: AWE
  show_if: openg2p-awe.enabled=true

# Partner Management
- variable: partner-management.enabled
  description: >-
    Install Partner Management — the central registry of partner public keys
    (onboarding, approval & key rotation, plus the key-fetch API other modules
    use). Deployed as commons-services-pm-*.
  type: boolean
  label: Install Partner Management?
  group: Partner Management

- variable: partner-management.global.staffPortalUiHostname
  description: >-
    Hostname for the Partner Management admin portal (UI). Defaults to
    partner-management.<Base Domain>.
  type: string
  label: Partner Management Portal Hostname
  group: Partner Management
  show_if: partner-management.enabled=true

# Consent Manager
- variable: openg2p-consent-manager.enabled
  description: >-
    Install the Consent Manager — the Policy Decision Point that verifies
    partner-signed consent objects for outbound data sharing (the /validate PDP,
    receipts, JWKS, admin UI). Requires Partner Management (source of partner
    keys). Deployed as commons-services-cm-*.
  type: boolean
  default: true
  label: Install Consent Manager?
  group: Consent Manager

- variable: openg2p-consent-manager.global.consentManagerHostname
  description: >-
    Hostname for the Consent Manager admin portal (UI + staff API). Defaults to
    consent-manager.<Base Domain>.
  type: string
  label: Consent Manager Portal Hostname
  group: Consent Manager
  show_if: openg2p-consent-manager.enabled=true

- variable: openg2p-consent-manager.global.aweEnabled
  description: >-
    Require AWE approval for policy changes that widen a partner's access (and
    for a new binding's first policy). Approvers need the consent-manager client
    role CONSENT_MANAGER_APPROVER. Requires AWE.
  type: boolean
  default: false
  label: Require AWE Approval for Policy Widening?
  group: Consent Manager
  show_if: openg2p-consent-manager.enabled=true

- variable: openg2p-consent-manager.sanity.runE2e
  description: >-
    Run the full end-to-end sanity (signed /validate round-trip) on each
    install/upgrade. This seeds a persistent test partner into Partner
    Management first. Leave off for production; the smoke + contract checks
    still run either way.
  type: boolean
  label: Run Consent Manager E2E Sanity?
  group: Consent Manager
  show_if: openg2p-consent-manager.enabled=true

# Signing key: receipts and consent records are signed with it. The demo key is
# public — every real install sets its own.
- variable: openg2p-consent-manager.consentManagerApi.signingKey.mode
  description: >-
    Where the Consent Manager's signing key (.p12) comes from. demo = the
    bundled demo key: public, for testing only. existing = a Secret you create
    in this namespace first (Storage → Secrets, keys cm_signing.p12 and
    password). Use existing for anything beyond testing, and always for an Agri
    Stack exchange (other Consent Managers trust this key).
  type: enum
  options:
    - demo
    - existing
  default: demo
  label: Signing Key
  group: Consent Manager
  show_if: openg2p-consent-manager.enabled=true

- variable: openg2p-consent-manager.consentManagerApi.signingKey.secretName
  description: >-
    The Secret with the .p12 (key cm_signing.p12) and its password (key
    password), e.g. agrix-cm-signing.
  type: string
  default: consent-manager-signing
  label: Signing Key Secret
  group: Consent Manager
  show_if: openg2p-consent-manager.enabled=true&&openg2p-consent-manager.consentManagerApi.signingKey.mode=existing

- variable: openg2p-consent-manager.global.consentSigningKid
  description: >-
    A label (kid) for the signing key, published in the JWKS and stamped on
    receipts, e.g. agrix-cm-2026-01. Change it when you rotate the key.
  type: string
  default: cm-2025-01
  label: Signing Key ID
  group: Consent Manager
  show_if: openg2p-consent-manager.enabled=true&&openg2p-consent-manager.consentManagerApi.signingKey.mode=existing

# Consent tokens between Consent Managers (e.g. Agri Stack): off by default.
- variable: openg2p-consent-manager.global.agriStackExchange.enabled
  description: >-
    Short-lived consent tokens between Consent Managers (Agri Stack). Exchange
    role: this CM issues a signed token per registry to a composite. Department
    role: this CM accepts the tokens of an exchange CM. Leave off otherwise.
  type: boolean
  default: false
  label: Consent Tokens (Exchange)?
  group: Consent Manager
  show_if: openg2p-consent-manager.enabled=true

- variable: openg2p-consent-manager.global.agriStackExchange.issuer
  description: >-
    Exchange role: the issuer ID on the consent tokens this CM signs, e.g.
    agri-stack-exchange-cm. Empty = this CM issues no tokens (department
    role only).
  type: string
  default: ""
  label: Token Issuer ID (exchange)
  group: Consent Manager
  show_if: openg2p-consent-manager.enabled=true&&openg2p-consent-manager.global.agriStackExchange.enabled=true

- variable: openg2p-consent-manager.global.agriStackExchange.receiptPresenters
  description: >-
    Exchange role: comma-separated callers allowed to request consent tokens, e.g.
    agri-composite.
  type: string
  default: ""
  label: Token Presenters (exchange)
  group: Consent Manager
  show_if: openg2p-consent-manager.enabled=true&&openg2p-consent-manager.global.agriStackExchange.enabled=true

- variable: openg2p-consent-manager.global.agriStackExchange.trustedIssuer.issuer
  description: >-
    Department role: the issuer ID of the exchange CM whose consent tokens
    this CM accepts, e.g. agri-stack-exchange-cm. Empty = no tokens accepted.
  type: string
  default: ""
  label: Trusted Token Issuer ID (department)
  group: Consent Manager
  show_if: openg2p-consent-manager.enabled=true&&openg2p-consent-manager.global.agriStackExchange.enabled=true

- variable: openg2p-consent-manager.global.agriStackExchange.trustedIssuer.jwksUrl
  description: >-
    Department role: the exchange CM partner API's JWKS URL, e.g.
    https://consent-manager-partner.agrix.openg2p.org/api/consent-manager-partner/.well-known/jwks.json
  type: string
  default: ""
  label: Trusted Issuer JWKS URL (department)
  group: Consent Manager
  show_if: openg2p-consent-manager.enabled=true&&openg2p-consent-manager.global.agriStackExchange.enabled=true

- variable: openg2p-consent-manager.global.agriStackExchange.trustedIssuer.presenter
  description: >-
    Department role: the only presenter accepted on that issuer's tokens,
    e.g. agri-composite.
  type: string
  default: ""
  label: Trusted Issuer Presenter (department)
  group: Consent Manager
  show_if: openg2p-consent-manager.enabled=true&&openg2p-consent-manager.global.agriStackExchange.enabled=true

# Partner portal: consent collected in person by partner users. Off by default.
- variable: openg2p-consent-manager.partnerPortal.enabled
  description: >-
    The partner portal: partner users (e.g. bank staff) raise consent requests
    and upload the subject's signed form; CM staff verify them. Creates the
    Keycloak realm `partner`. After install, run setup-partner-realm.sh once
    (consent-manager repository) for its roles and partner users.
  type: boolean
  default: false
  label: Partner Portal?
  group: Consent Manager
  show_if: openg2p-consent-manager.enabled=true

- variable: openg2p-consent-manager.partnerPortal.subjectAuth.enabled
  description: >-
    Require the subject's national-ID login through eSignet on every request
    (with the signed form and the staff check). Needs eSignet and, for testing,
    the mock identity system.
  type: boolean
  default: false
  label: Require National-ID Login (eSignet)?
  group: Consent Manager
  show_if: openg2p-consent-manager.enabled=true&&openg2p-consent-manager.partnerPortal.enabled=true

- variable: openg2p-consent-manager.partnerPortal.requiredSubjectIdentifiers
  description: >-
    Comma-separated identifiers every request must carry besides the subject
    ID, checked by staff in the registry, e.g. FARMER_ID for Agri Stack.
  type: string
  default: ""
  label: Required Subject Identifiers
  group: Consent Manager
  show_if: openg2p-consent-manager.enabled=true&&openg2p-consent-manager.partnerPortal.enabled=true

- variable: openg2p-consent-manager.partnerPortal.compositeUrl
  description: >-
    Optional: an Agri Stack composite's URL, e.g.
    https://agri-composite.agrix.openg2p.org. The portal then lists its use
    cases and fills requests from them.
  type: string
  default: ""
  label: Composite URL
  group: Consent Manager
  show_if: openg2p-consent-manager.enabled=true&&openg2p-consent-manager.partnerPortal.enabled=true

# ---------------------------------------------------------------------------
# Inji Certify — the verifiable credential issuer.
# ---------------------------------------------------------------------------
- variable: openg2p-inji-certify.enabled
  description: "Issue and sign verifiable credentials. One issuer per environment; the registries' agent portals push claims here. Turning it off leaves an environment unable to produce a credential at all."
  type: boolean
  default: true
  label: Install Inji Certify?
  group: Verifiable Credentials

- variable: global.certifyHostname
  description: "Public hostname of the issuer. It also determines the issuer DID (did:web:<hostname>) that every credential is signed under, and the audience Certify accepts on incoming proofs — so a registry issuing credentials must be given the SAME value. Defaults to certify.<Base Domain>."
  type: string
  label: Certify Hostname
  group: Verifiable Credentials
  show_if: openg2p-inji-certify.enabled=true

- variable: openg2p-inji-certify.certify.appConfig.issuerDisplay[0].name
  description: "Name of the issuing authority, published in the issuer metadata — this is what a wallet or verifier shows as 'issued by'. Set it to the department or agency that owns the credentials."
  type: string
  default: OpenG2P
  label: Issuing Authority Name
  group: Verifiable Credentials
  show_if: openg2p-inji-certify.enabled=true

- variable: openg2p-inji-verify.enabled
  description: >-
    Install Inji Verify, which checks verifiable credentials presented to it.
    Not needed where no credentials are verified (e.g. an Agri Stack exchange).
  type: boolean
  default: true
  label: Install Inji Verify?
  group: Verifiable Credentials

# eSignet: how a beneficiary proves who they are before a credential is issued.
- variable: esignet.enabled
  description: >-
    Install eSignet, the login service a beneficiary uses to prove who they are
    before the Agent Portal issues them a credential.
  type: boolean
  label: Install eSignet?
  group: Verifiable Credentials

- variable: mock-identity-system.enabled
  description: >-
    Install the mock identity system eSignet checks people against (test
    identities). Needed by eSignet unless it is connected to a real ID system.
  type: boolean
  label: Install Mock Identity System?
  group: Verifiable Credentials

# Artifactory: serves runtime files (plugins, configs) to eSignet, the mock identity
# system and Keymanager. It has its own switch, so it stays on unless turned off here.
- variable: artifactory.enabled
  description: >-
    Install Artifactory, which serves runtime files to eSignet, the mock identity
    system and Keymanager. Needed if any of them is on; turn it off when all three
    are off.
  type: boolean
  label: Install Artifactory?
  group: Verifiable Credentials

# Keymanager (standalone). Agri Stack does not use it; see values.yaml.
- variable: keymanager.enabled
  description: >-
    Install the standalone MOSIP Keymanager (off by default). Turn it on for
    PBMS, which signs G2P Bridge disbursement requests with it, or for a
    registry whose partner key backend is set to 'keymanager'. Registries, Open
    Agri Stack, eSignet, the mock identity system and Inji Certify do not need it.
  type: boolean
  default: false
  label: Install Keymanager?
  group: Keymanager

- variable: keymanager.istio.enabled
  description: >-
    Expose the Keymanager APIs outside the cluster, to download or upload
    certificates by hand. Leave off otherwise.
  type: boolean
  label: Expose Keymanager APIs?
  group: Keymanager
  show_if: keymanager.enabled=true

# WebSub. Uses the Kafka installed by commons-base.
- variable: websub.enabled
  description: >-
    Install the MOSIP WebSub hub and consolidator. Registries publish change
    events and async search results here. Uses the Kafka from commons-base
    (commons-kafka). Turn it off only if nothing in this environment publishes
    or subscribes.
  type: boolean
  default: true
  label: Install WebSub?
  group: WebSub

- variable: websub.hostname
  description: Hostname of the WebSub hub. Defaults to websub.<Base Domain>.
  type: string
  label: WebSub Hostname
  group: WebSub
  show_if: websub.enabled=true
