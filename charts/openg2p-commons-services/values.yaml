global:
  # Derived from the install namespace so a fresh install lands on a sensible
  # per-environment domain (e.g. namespace 'trial' -> trial.openg2p.org) instead
  # of a hardcoded one that has to be overridden every time.
  # NOTE: every consumer renders this with `tpl` — keep it that way, otherwise
  # the {{ }} here is emitted literally into hostnames.
  baseDomain: '{{ .Release.Namespace }}.openg2p.org'
  # Derived from baseDomain. Override only when using an external Keycloak.
  keycloakBaseUrl: 'https://keycloak.{{ tpl .Values.global.baseDomain $ }}'
  # Internal (in-cluster) URL for pod-to-Keycloak communication (HTTP, no TLS).
  # Defaults assume base release name is 'commons'.
  keycloakInternalUrl: 'http://commons-keycloak:80'
  # Internal issuer URL — used by backend pods for OIDC discovery, JWK fetching, token validation.
  keycloakRealm: staff
  keycloakIssuerUrl: '{{ (tpl (.Values.global.keycloakInternalUrl | default .Values.global.keycloakBaseUrl) $) }}/realms/{{ tpl .Values.global.keycloakRealm $ }}'
  # External issuer URL — used for browser-facing OAuth redirects (authorize endpoint, login redirects).
  keycloakExternalIssuerUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/{{ tpl .Values.global.keycloakRealm $ }}'

  # These reference services from openg2p-commons-base.
  # Defaults assume base release name is 'commons'. If your base release has a
  # different name, override these (install.sh does this automatically).
  postgresqlHost: commons-postgresql
  # PostgreSQL superuser secret (created by base chart's PostgreSQL or pre-created
  # for external PostgreSQL). install.sh sets this from BASE_RELEASE.
  postgresqlSecret: commons-postgresql
  postgresqlSecretKey: postgres-password
  mailInstallationName: commons-mail
  minioInstallationName: commons-minio

  sysAdminEmail: admin@openg2p.sandbox.org
  redisInstallationName: commons-redis
  redisAuthInstallationName: commons-redis-auth
  kafkaInstallationName: commons-kafka
  softhsmInstallationName: commons-softhsm

  # ── Service hostnames owned by commons-services ─────────────────────────────
  # Single source of truth used by both the actual service deployments and the
  # keycloak-init redirect URIs below. Override these if your environment uses a
  # different naming convention (e.g. <service>.<env>.<domain>).
  supersetHostname: 'superset.{{ tpl .Values.global.baseDomain $ }}'
  odkHostname: 'odk.{{ tpl .Values.global.baseDomain $ }}'
  # iamHostname is the family-level base (e.g. iam.<baseDomain>). Specific
  # IAM service APIs are derived from it via a service-specific prefix.
  iamHostname: 'iam.{{ tpl .Values.global.baseDomain $ }}'
  # Hostname of the IAM staff portal API. Used by both the IAM service deployment
  # and the Keycloak staff-portal client's redirect URI — single source of truth.
  staffPortalApiHostname: 'staff-{{ tpl .Values.global.iamHostname $ }}'
  # Agent portal (IAM). Agents are a separate audience from staff — their own
  # realm, their own host.
  agentPortalApiHostname: 'agent-{{ tpl .Values.global.iamHostname $ }}'
  agentPortalHostname: 'agent-portal.{{ tpl .Values.global.baseDomain $ }}'
  # Inji Certify — the verifiable credential issuer. One per environment; the
  # registries push claims to it and reference its issuer DID.
  certifyHostname: 'certify.{{ tpl .Values.global.baseDomain $ }}'
  staffPortalHostname: 'staff-portal.{{ tpl .Values.global.baseDomain $ }}'
  staffPortalCookieDomain: '.{{ tpl .Values.global.baseDomain $ }}'

  # ── Cross-chart references ─────────────────────────────────────────────────
  # Internal cluster URL of the IAM staff portal API. Default assumes services
  # release is 'commons-services'. install.sh overrides this with the actual release name.
  iamServiceUrl: 'http://commons-services-iam-staff-portal-api'

  # Name of the K8s secret holding the Keycloak admin password — created by the
  # commons-base chart. Used by services-chart keycloak-init and client-secrets-sync
  # to authenticate to the Keycloak admin API. Default assumes base release is 'commons'.
  keycloakAdminSecret: commons-keycloak
  keycloakAdminSecretKey: admin-password
  keycloakAdminUser: admin

  # ── AWE (Approval Workflow Engine) ──────────────────────────────────────────
  # Single shared AWE for the environment (installed by the openg2p-awe subchart).
  # Hostname follows the commons <service>.<baseDomain> convention.
  aweHostname: 'awe.{{ tpl .Values.global.baseDomain $ }}'
  # Fixed DB contract for the shared AWE — kept stable (NOT release-scoped) so the
  # registries can register their callback secret into this exact DB/secret.
  # AWE's bundled postgres-init (awe-pg-init) creates the DB, user and Secret.
  aweDB: awe
  aweDBPort: 5432
  aweDBUser: awe_user
  aweDBSecret: awe-db-user
  aweDBUserPasswordKey: awe-db-user-password

# Logging is now handled cluster-wide by the OpenTelemetry + Loki stack at the
# infra layer (the OTel agent DaemonSet tails every pod automatically), so the
# per-service Fluentd Flow/Output that used to ship to OpenSearch has been
# removed. No app-level logging config is required here anymore.

masterData:
  enabled: true
  global:
    masterDataHostname: 'master-data.{{ tpl .Values.global.baseDomain $ }}'
    # Plain DB names (no release-name prefix). Only one instance per env.
    masterDataDB: master_data
    masterDataDBUser: master_data_user
    # NOTE: must NOT be plain 'master-data' — keycloak-init names its client-secret
    # Secret after the clientId, and a 'master-data' Keycloak client exists. Both
    # templates are lookup-guarded ('create only if absent') with resource-policy:
    # keep, so whichever ran first won and the other silently skipped — leaving a
    # Secret with only client_secret and no master-data-db-user key, which failed
    # master-data-api with 'couldn't find key master-data-db-user'. Suffixed '-db'
    # to match partner-management-db / consent-manager-db.
    masterDataDBSecret: master-data-db
    masterDataDBUserPasswordKey: master-data-db-user
  # The country this environment serves — declared HERE and nowhere else.
  #
  # One Master Data per environment means one geography, one set of code lists
  # and one set of sample people. Registries read all three from it and name no
  # country of their own, which is what lets the same registry image serve any
  # country: letting a registry chart also pick one is how the two end up
  # disagreeing, silently.
  #
  # The subchart defaults to XKM (Kamuntu, fictitious) so an unconfigured
  # install cannot attach invented figures to a real country. A real deployment
  # names its country, so this one does.
  geoSeed:
    # The value is a DIRECTORY NAME under packs/ in openg2p-data
    # (https://github.com/openg2p/openg2p-data), conventionally the ISO 3166
    # alpha-3 code. Not a fixed list — adding a country means adding data to that
    # repository, not changing anything here. To build a pack for a country with
    # a published COD-AB dataset, see Country Data Architecture in the OpenG2P
    # documentation.
    #
    # Shipped today:
    #   ETH  Ethiopia, OCHA COD-AB via HDX: country > region > zone > woreda,
    #        1271 units. CC BY-IGO — attribution required, recorded in the pack's
    #        manifest and printed at seed time. Boundaries are operational, not a
    #        statement on legal or political status.
    #   XKM  Kamuntu, fictitious, for demos and tests. Its P-codes come from the
    #        ISO 3166 user-assigned ranges, so they can never collide with a real
    #        country's.
    #
    # Whatever is set here must also be set as the maps country pack in the G2P
    # Insights chart, where installed: the choropleth joins its figures to its
    # shapes on P-code, so a mismatch draws an empty map rather than an error.
    countryPack: ETH
    load:
      geo: true
      # Registries copy these into their own tables at install. Off leaves each
      # registry on the values its extension ships, and the semantic role tags —
      # which nothing else provides — absent entirely.
      codelists: true
      # A couple of dozen country-coherent people, so a fresh install shows
      # something rather than an empty registry. Not bulk analytics data.
      samples: true
    # Domain code lists, on top of the core ones. 'agriculture' (crops,
    # livestock) is needed by a Farmer Registry; a social registry never reads
    # them. Comma-separated in the Rancher form, a list here.
    domains: []

  # Based on observed usage ~442Mi.
  masterDataApi:
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
  postgres-init:
    serviceAccount:
      # Use a unique name to avoid collision with the main postgres-init ServiceAccount.
      # Both subcharts produce the same default name (commons-postgres-init).
      name: master-data-postgres-init
    job: {}

odk-central:
  enabled: true
  hostname: '{{ tpl .Values.global.odkHostname $ }}'

  postgresqlInstallationName: '{{ tpl .Values.global.postgresqlHost $ }}'
  minioInstallationName: '{{ tpl .Values.global.minioInstallationName $ }}'
  mailInstallationName: '{{ tpl .Values.global.mailInstallationName $ }}'

  oidcClientId: openg2p-odk
  # Name of the secret in Kubernetes containing (DO NOT put password directly here)
  # Same name as client id by convention.
  oidcClientSecret: '{{ tpl .Values.oidcClientId $ }}'
  # Key containing client password. Hardcoded in Keycloak Init script
  oidcClientSecretKey: 'client_secret'

  s3BlobsEnabled: true
  # MinIO S3 API port (the bitnami chart exposes S3 on 9000, console on 9001).
  # Use the internal cluster service name — pod-to-pod, not via Istio.
  s3ServerUrl: 'http://{{ tpl .Values.global.minioInstallationName $ }}:9000'

  odk-central-enketo:
    enabled: true
    # Based on observed usage ~468Mi.
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
    envVars:
      # Here we pointing to the same redis instance for both. This redis does not have
      # persistence. This is ok since we use the online form feature for testing and
      # not full fledged used in production. ODK is mostly used in offline mode.
      REDIS_MAIN_HOST: '{{ tpl .Values.global.redisInstallationName $ }}-master'
      REDIS_CACHE_HOST: '{{ tpl .Values.global.redisInstallationName $ }}-master'

  # Based on observed usage: pyxform ~135Mi, frontend ~8Mi.
  pyxform:
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
  frontend:
    resources:
      requests:
        cpu: 20m
        memory: 32Mi

  backend:
    # Based on observed usage ~400Mi.
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
    initContainers:
    - name: wait-for-minio
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          until nc -zv {{ tpl .Values.global.minioInstallationName $ }} 9000; do
            echo "Waiting for MinIO..."
            sleep 2
          done
    envVars:
      OIDC_ENABLED: true
      OIDC_ISSUER_URL: '{{ tpl .Values.global.keycloakIssuerUrl $ }}'
      OIDC_CLIENT_ID: '{{ tpl .Values.oidcClientId $ }}'

    envVarsFrom:
      DB_PASSWORD:
        secretKeyRef:
          # MUST MATCH one defined under postgres-init
          name: odk-db-user
          key: odk-db-user-password
      OIDC_CLIENT_SECRET:
        secretKeyRef:
          name: '{{ tpl .Values.oidcClientSecret $ }}'
          key: '{{ tpl .Values.oidcClientSecretKey $ }}'

artifactory:
  enabled: true
  image:
    repository: mosipid/artifactory-server
    tag: 1.4.1-ES
  # Based on observed usage ~2Mi. Small nginx server.
  resources:
    requests:
      cpu: 20m
      memory: 32Mi

keymanager:
  enabled: true
  hostname: 'keymanager.{{ tpl .Values.global.baseDomain $ }}'
  # Based on observed usage ~1436Mi. Spring Boot + HSM is memory-hungry.
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
  # Disabling for now. TODO - understand the implications
  authEnabled: false
  # For country deployments we may for file based keystore instead of SoftHSM
  keystoreType: PKCS12
  p12KeystorePass: ''
  # Postgres Init is important
  skipPostgresInitCheck: false
  # Keymanager should come up even if Keygen has not run. The idea is to have keygen run by individuals
  skipKeygenCheck: true
  postgresqlInstallationName: '{{ tpl .Values.global.postgresqlHost $ }}'
  softhsmInstallationName: '{{ tpl .Values.global.softhsmInstallationName $ }}'
  artifactoryInstallationName: '{{ .Release.Name }}-artifactory'
  istio:
    enabled: false
  springConfig:
    names: application,kernel
    profile: default
    gitRepo:
      enabled: true
      repoUrl: https://github.com/openg2p/mosip-config
      # This branch has user name as per our conventions here
      branch: master
    rawConfig: ""
  envVars:
    JDK_JAVA_OPTIONS: "-XX:-UseContainerSupport -Dspring.jmx.enabled=false -Dcom.sun.management.jmxremote=false"
    auth_server_admin_allowed_audience: 'openg2p-registry,openg2p-registry-{{ .Release.Namespace }},openg2p-pbms,openg2p-pbms-{{ .Release.Namespace }},openg2p-spar,openg2p-spar-{{ .Release.Namespace }},openg2p-g2p-bridge,openg2p-g2p-bridge-{{ .Release.Namespace }}'
    keycloak_internal_url: '{{ tpl .Values.global.keycloakInternalUrl $ }}'
    keycloak_external_url: '{{ tpl .Values.global.keycloakBaseUrl $ }}'
  envVarsFrom:
    db_dbuser_password:
      secretKeyRef:
        name: keymgr-db-user
        key: keymgr-db-user-password
  postgresInit:
    enabled: true
    # Nullify hook annotations so these run as regular resources (Rancher skips hooks).
    commonAnnotations:
      "helm.sh/hook": null
      "helm.sh/hook-weight": null
      "helm.sh/hook-delete-policy": null
    #forceRun: true
    envVars:
      DB_USER: keymgruser
    envVarsFrom:
      # Override SU_USER_PWD so it uses the configurable global secret instead of
      # the subchart default (which derives from postgresqlInstallationName).
      # Critical for external PostgreSQL where secret name differs from host.
      SU_USER_PWD:
        secretKeyRef:
          name: '{{ tpl .Values.global.postgresqlSecret $ }}'
          key: '{{ tpl .Values.global.postgresqlSecretKey $ }}'
      DBUSER_PWD:
        # Must be same as above
        secretKeyRef:
          name: keymgr-db-user
          key: keymgr-db-user-password
  keygen:
    enabled: true
    # Nullify hook annotations so these run as regular resources (Rancher skips hooks).
    commonAnnotations:
      "helm.sh/hook": null
      "helm.sh/hook-weight": null
      "helm.sh/hook-delete-policy": null
    appIdsList:
      - OPENG2P_SR
      - OPENG2P_SR_NID
      - OPENG2P_SPAR
      - OPENG2P_SPAR_NID
      - OPENG2P_PBMS
      - OPENG2P_PBMS_NID
      - OPENG2P_BRIDGE
      - OPENG2P_BRIDGE_NID

    baseKeysList:
      - OPENG2P_SR:ENCRYPT
      - OPENG2P_SR_NID:ENCRYPT
      - OPENG2P_SPAR:ENCRYPT
      - OPENG2P_SPAR_NID:ENCRYPT
      - OPENG2P_PBMS:ENCRYPT
      - OPENG2P_PBMS_NID:ENCRYPT
      - OPENG2P_BRIDGE:ENCRYPT
      - OPENG2P_BRIDGE_NID:ENCRYPT

    envVars:
      JDK_JAVA_OPTIONS: "-XX:-UseContainerSupport -Dspring.jmx.enabled=false -Dcom.sun.management.jmxremote=false"

  persistence:
    enabled: true

superset:
  enabled: true
  hostname: '{{ tpl .Values.global.supersetHostname $ }}'

  oidcIssuerUrl: '{{ tpl .Values.global.keycloakIssuerUrl $ }}'
  oidcClientId: openg2p-superset

  supersetSecretKey: ''

  # envFromSecrets supports tpl (unlike extraEnvRaw), so we can use dynamic names.
  # All keys from these secrets are loaded as env vars.
  envFromSecrets:
    - openg2p-superset

  extraEnvRaw:
  - name: DB_PASS
    valueFrom:
      secretKeyRef:
        name: superset-db-user
        key: superset-db-user-password

  init:
    createAdmin: false
    # NOTE: `jobAnnotations: {}` does NOT clear the subchart's defaults — Helm
    # deep-merge keeps subchart map keys — so the keys are restated explicitly
    # here to actually override them.
    #
    # hook-succeeded is added to the delete policy: the DB migration can hit a
    # transient Postgres deadlock on its first attempt (DDL vs. the already-
    # running superset web/worker pods) and only succeed on a retry. The Job
    # tolerates that (backoffLimit), but with only `before-hook-creation` the
    # failed pod lingers until the next deploy and makes a healthy release look
    # broken. `hook-succeeded` deletes the Job (and its pods) once it succeeds,
    # so a passing install leaves nothing behind; `before-hook-creation` is kept
    # so a genuinely failing Job is still retained for debugging and is cleaned
    # up before the next run.
    jobAnnotations:
      "helm.sh/hook": post-install,post-upgrade
      "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation

  # Tell Superset chart not to install Postgresql
  postgresql:
    enabled: false

  # Since we have a common Redis, we tell Superset chart not to install Redis
  redis:
    enabled: false

  supersetNode:
    # Increased from 512Mi after OOMs observed in practice.
    # For production with heavy dashboard usage, consider 2Gi.
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
    connections:
      redis_host: '{{ tpl .Values.global.redisInstallationName $ }}-master'
      db_host: '{{ tpl .Values.global.postgresqlHost $ }}'
      # db_pass intentionally empty — the real password comes from extraEnvRaw
      # (secret superset-db-user created by postgres-init). This prevents the
      # commons-superset-env secret from containing a stale/wrong DB_PASS.
      db_pass: ''

  # Based on observed usage ~813Mi.
  supersetWorker:
    resources:
      requests:
        cpu: 50m
        memory: 768Mi

  bootstrapScript: |
    #!/bin/bash
    pip install authlib==1.3.0

  configOverrides:
    enable_oauth: |
      import os
      SECRET_KEY = '{{ tpl .Values.supersetSecretKey $ }}' or 'OPENG2P_SUPER_SECRET_KEY'

      # This will make sure the redirect_uri is properly computed, even with SSL offloading
      ENABLE_PROXY_FIX = True

      from flask_appbuilder.security.manager import AUTH_OAUTH
      AUTH_TYPE = AUTH_OAUTH
      OAUTH_PROVIDERS = [
        {
          "name": "keycloak",
          "icon": "fa-key",
          "token_key": "access_token",
          "remote_app": {
            "client_id": "{{ tpl .Values.oidcClientId $ }}",
            "client_secret": os.getenv("client_secret"),
            "api_base_url": "{{ tpl .Values.oidcIssuerUrl $ }}/protocol/openid-connect",
            "client_kwargs": {"scope": "email profile openid"},
            "access_token_url": "{{ tpl .Values.oidcIssuerUrl $ }}/protocol/openid-connect/token",
            "jwks_uri": "{{ tpl .Values.oidcIssuerUrl $ }}/protocol/openid-connect/certs",
            "authorize_url": "{{ tpl .Values.global.keycloakExternalIssuerUrl $ }}/protocol/openid-connect/auth",
            "request_token_url": None
          },
        }
      ]

      # Map Authlib roles to superset roles
      AUTH_ROLES_MAPPING = {
        "Public": ["Public"],
        "Admin": ["Admin"],
      }

      AUTH_ROLES_SYNC_AT_LOGIN = True

      # Will allow user self registration, allowing to create Flask users from Authorized User
      AUTH_USER_REGISTRATION = True

      # The default user self registration role
      # AUTH_USER_REGISTRATION_ROLE = "Public"

      from superset.security import SupersetSecurityManager
      class CustomSsoSecurityManager(SupersetSecurityManager):
        def oauth_user_info(self, provider, response=None):
          if provider == "keycloak":
            me = self.appbuilder.sm.oauth_remotes[provider].get(
              "openid-connect/userinfo"
            )
            me.raise_for_status()
            data = me.json()
            return {
              "username": data.get("preferred_username", ""),
              "first_name": data.get("given_name", ""),
              "last_name": data.get("family_name", ""),
              "email": data.get("email", ""),
              "role_keys": data.get("client_roles", []),
            }
          return {}

      CUSTOM_SECURITY_MANAGER = CustomSsoSecurityManager
      SESSION_COOKIE_HTTPONLY = True
      SESSION_COOKIE_SECURE = True
      SESSION_COOKIE_SAMESITE = None
      TALISMAN_ENABLED = False

      # Embedded dashboards. G2P Insights shows Superset dashboards inside its
      # own shell, which loads /embedded/<uuid> in an iframe — a route Superset
      # only registers when this flag is on.
      #
      # Without it the failure is silent in an unhelpful way: the REST call that
      # mints an embedded UUID still succeeds, the guest token is still issued
      # and looks valid, so every check passes and only the iframe 404s. It reads
      # as a broken client, not a missing feature flag.
      FEATURE_FLAGS = {"EMBEDDED_SUPERSET": True}

      # The role a guest token carries. Gamma can read the dashboards it is
      # granted and nothing else, which is what an embedded viewer needs.
      GUEST_ROLE_NAME = "Gamma"

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: ""
      gateway: "internal"
      destination: '{{ include "superset.fullname" . }}'
      destinationPort: '{{ .Values.service.port }}'
    gateway:
      enabled: false
      host: ""
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: true
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

esignet:
  # ── Probe budgets ────────────────────────────────────────────────────────
  # Raised from the subchart defaults (startup 300s / liveness 80s).
  #
  # On first boot this service generates its keymanager keypairs, which on a
  # modest cluster takes several minutes — the keymanager log shows 30s gaps
  # between single key operations. The default startup budget expired mid-way,
  # kubelet killed the container ("failed startup probe, will be restarted"),
  # and the restart began key generation again from scratch: a loop that never
  # converges and looks like a crash but is only impatience.
  #
  # startupProbe is the one that matters — while it is running, readiness and
  # liveness are suspended, so a generous budget here costs nothing on restarts
  # once the keys exist (the probe then passes on its first attempt).
  startupProbe:
    failureThreshold: 90     # 90 x 10s = 15 min for first-boot key generation
    periodSeconds: 10
  livenessProbe:
    # Also raised: a slow but healthy service should not be killed outright.
    failureThreshold: 12
    initialDelaySeconds: 60
  # Requires softhsm (enabled in commons-base): esignet embeds its own keymanager
  # and initialises signing keys against the HSM (unconditional PKCS11 socket +
  # security-pin from the softhsm ConfigMap/Secret; no PKCS12 path in this chart).
  enabled: true
  hostname: 'esignet.{{ tpl .Values.global.baseDomain $ }}'
  # Based on observed usage ~1940Mi. eSignet is the largest memory consumer.
  # For production, increase limit to 4Gi.
  resources:
    requests:
      cpu: 100m
      memory: 2Gi

  captchaEnabled: false

  envVars:
    esignet_captcha_site_key: ''
    esignet_captcha_secret_key: ''
    JDK_JAVA_OPTIONS: "-XX:-UseContainerSupport -Dspring.jmx.enabled=false -Dmosip.kernel.keymanager.hsm.keystore-type=PKCS12 -Dmosip.kernel.keymanager.hsm.config-path=/home/mosip/keystore/local.p12"
    keycloak_internal_url: '{{ tpl .Values.global.keycloakInternalUrl $ }}'
    keycloak_external_url: '{{ tpl .Values.global.keycloakBaseUrl $ }}'
  artifactoryInstallationName: '{{ .Release.Name }}-artifactory'
  # Note Redis Auth used here
  redisInstallationName: '{{ tpl .Values.global.redisAuthInstallationName $ }}'
  kafkaInstallationName: '{{ tpl .Values.global.kafkaInstallationName $ }}'
  mockIdentitySystemInstallationName: '{{ .Release.Name }}-mock-identity-system'
  softhsmInstallationName: '{{ tpl .Values.global.softhsmInstallationName $ }}'
  postgresqlInstallationName: '{{ tpl .Values.global.postgresqlHost $ }}'

  # ── PKCS12 keystore (replaces SoftHSM) ───────────────────────────────────
  # These properties come from the config git repo the image clones at start,
  # so the chart has no values for them. JDK_JAVA_OPTIONS reaches the JVM as
  # system properties, which outrank properties files — that is the override
  # path, and it needs no fork of the subchart or of openg2p/mosip-config.
  #
  # The password is NOT set here: a -D value is visible in the pod spec. It is
  # injected as an env var from the managed Secret below, the same way the
  # standalone keymanager service does it.
  extraVolumes:
    - name: keystore
      persistentVolumeClaim:
        claimName: '{{ .Release.Name }}-esignet-keystore'
  extraVolumeMounts:
    # Writable: keymanager creates local.p12 here on first boot.
    - name: keystore
      mountPath: /home/mosip/keystore
  envVarsFrom:
    # SoftHSM is disabled in commons-base, so the subchart's defaults for these
    # two point at a ConfigMap/Secret that no longer exists — which would fail
    # the pod with CreateContainerConfigError.
    #
    # Marked optional rather than removed or blanked. null does not delete a
    # subchart default (Helm's coalesce keeps it, and the chart's envVars helper
    # ranges over every key with no skip condition), and an empty string, while
    # it does win, is a non-table replacing a table — Helm warns
    # "cannot overwrite table with non table" on every single install.
    #
    # `optional: true` keeps the same map shape, so the merge is clean and
    # silent, and Kubernetes simply omits the variable when the source is
    # absent. Harmless either way: keystore-type=PKCS12 means the PKCS11 path is
    # never taken.
    PKCS11_PROXY_SOCKET:
      configMapKeyRef:
        name: '{{ tpl .Values.softhsmInstallationName $ }}-share'
        key: PKCS11_PROXY_SOCKET
        optional: true
    softhsm_esignet_security_pin:
      secretKeyRef:
        name: '{{ tpl .Values.softhsmInstallationName $ }}'
        key: security-pin
        optional: true
    mosip_kernel_keymanager_hsm_keystore_pass:
      secretKeyRef:
        name: '{{ .Release.Name }}-esignet-keystore'
        key: p12-keystore-pass
    db_dbuser_password:
      secretKeyRef:
        # Must match postgres-init
        name: esignet-db-user
        key: esignet-db-user-password
    spring_redis_password:
      secretKeyRef:
        name: '{{ tpl .Values.redisInstallationName $ }}'
        # In our common Redis, auth is disabled, so we have created this manaully with random password
        key: redis-password

  # The subchart ships postgres-init (the keymanager schema: key_alias,
  # key_store, …) as a `post-install` HOOK, which deadlocks `helm --wait`: the
  # pods can't become Ready until the schema exists, but the post-install hook
  # that creates the schema only runs AFTER the release is Ready. Helm cannot
  # reliably strip a subchart's hook annotation via values `null` (verified on
  # Helm v4), so we DISABLE the subchart's hook Job here and run the equivalent
  # as an ordinary resource in templates/esignet-mock-schema-init.yaml.
  postgresInit:
    enabled: false

  springConfig:
    names: application,esignet
    profile: default
    gitRepo:
      enabled: true
      repoUrl: https://github.com/openg2p/mosip-config
      branch: master
    rawConfig: ""

mock-identity-system:
  # ── Probe budgets ────────────────────────────────────────────────────────
  # Raised from the subchart defaults (startup 300s / liveness 80s).
  #
  # On first boot this service generates its keymanager keypairs, which on a
  # modest cluster takes several minutes — the keymanager log shows 30s gaps
  # between single key operations. The default startup budget expired mid-way,
  # kubelet killed the container ("failed startup probe, will be restarted"),
  # and the restart began key generation again from scratch: a loop that never
  # converges and looks like a crash but is only impatience.
  #
  # startupProbe is the one that matters — while it is running, readiness and
  # liveness are suspended, so a generous budget here costs nothing on restarts
  # once the keys exist (the probe then passes on its first attempt).
  startupProbe:
    failureThreshold: 90     # 90 x 10s = 15 min for first-boot key generation
    periodSeconds: 10
  livenessProbe:
    # Also raised: a slow but healthy service should not be killed outright.
    failureThreshold: 12
    initialDelaySeconds: 60
  # Requires softhsm (same as esignet — embeds its own keymanager, no PKCS12
  # path). It is also esignet's auth backend, so it runs alongside esignet.
  enabled: true
  hostname: 'esignet.{{ tpl .Values.global.baseDomain $ }}'
  # Based on observed usage ~912Mi.
  resources:
    requests:
      cpu: 50m
      memory: 1Gi

  softhsmInstallationName: '{{ tpl .Values.global.softhsmInstallationName $ }}'
  artifactoryInstallationName: '{{ .Release.Name }}-artifactory'

  envVars:
    JDK_JAVA_OPTIONS: "-XX:-UseContainerSupport -Dspring.jmx.enabled=false -Dmosip.kernel.keymanager.hsm.keystore-type=PKCS12 -Dmosip.kernel.keymanager.hsm.config-path=/home/mosip/keystore/local.p12"

  # ── PKCS12 keystore (replaces SoftHSM) ───────────────────────────────────
  # See the esignet block above for why: these properties live in the config git
  # repo the image clones, and JDK_JAVA_OPTIONS is how a chart overrides them.
  # The password is injected from the managed Secret rather than a -D value,
  # which would be readable in the pod spec.
  extraVolumes:
    - name: keystore
      persistentVolumeClaim:
        claimName: '{{ .Release.Name }}-mock-identity-system-keystore'
  extraVolumeMounts:
    - name: keystore
      mountPath: /home/mosip/keystore
  envVarsFrom:
    # Marked optional rather than removed — see the esignet block above for why
    # neither null nor an empty string is right here.
    PKCS11_PROXY_SOCKET:
      configMapKeyRef:
        name: '{{ tpl .Values.softhsmInstallationName $ }}-share'
        key: PKCS11_PROXY_SOCKET
        optional: true
    softhsm_mock_identity_system_security_pin:
      secretKeyRef:
        name: '{{ tpl .Values.softhsmInstallationName $ }}'
        key: security-pin
        optional: true
    mosip_kernel_keymanager_hsm_keystore_pass:
      secretKeyRef:
        name: '{{ .Release.Name }}-mock-identity-system-keystore'
        key: p12-keystore-pass
    db_dbuser_password:
      # MUST MATCH what is specified in postgres-init
      secretKeyRef:
        name: mockid-db-user
        key: mockid-db-user-password

  postgresqlInstallationName: '{{ tpl .Values.global.postgresqlHost $ }}'
  # DISABLED — see the esignet block above. The subchart's postgres-init ships
  # as a `post-install` hook that deadlocks `helm --wait`; the equivalent runs
  # as an ordinary resource in templates/esignet-mock-schema-init.yaml.
  postgresInit:
    enabled: false

  springConfig:
    names: application,mock-identity-system
    profile: default
    gitRepo:
      enabled: true
      repoUrl: https://github.com/openg2p/mosip-config
      branch: master
    rawConfig: ""

# ---------------------------------------------------------------------------
# Inji Certify — issues and signs verifiable credentials.
#
# ON by default: the registries ship an agent portal that pushes claims here, and
# an environment without an issuer cannot produce a credential at all. Set
# enabled: false for a deployment that does not issue.
#
# Everything below is defaulted so a stock install works with no extra input.
# The two values an operator would realistically change are the hostname (via
# global.certifyHostname) and the issuer DID.
# ---------------------------------------------------------------------------
openg2p-inji-certify:
  enabled: true

  global:
    certifyHostname: '{{ tpl .Values.global.certifyHostname $ }}'
    # The issuer identity stamped on every credential. Derived from the hostname
    # so a stock install is self-consistent; registries must be given this SAME
    # value (their global.vcIssuer.did) or the credentials they register will be
    # signed under an issuer nobody can resolve.
    vcIssuerDid: 'did:web:{{ tpl .Values.global.certifyHostname $ }}'

    postgresqlHost: '{{ tpl .Values.global.postgresqlHost $ }}'
    # Plain DB names, not release-derived. As a subchart the release name is
    # 'commons-services', which would otherwise produce a database called
    # commons_services holding nothing but Certify's tables.
    certifyDB: inji_certify
    certifyDBUser: inji_certify_user
    certifyDBSecret: inji-certify
    certifyDBUserPasswordKey: inji-certify-db-user

  certify:
    # Human-readable issuing authority, published in the issuer metadata and
    # shown by wallets and verifiers as "issued by". Certify will not start
    # without it.
    appConfig:
      issuerDisplay:
        - name: "OpenG2P"
          locale: en

    # The signing keystore IS the issuer identity: it plus the encrypted key rows
    # in Postgres are what every credential is signed with. Generated on first
    # boot onto a durable volume — never disable this, or a new key is minted on
    # every restart and every credential already issued becomes unverifiable.
    p12:
      enabled: true

  postgres-init:
    enabled: true
    # Named so it does not collide with the other subcharts' postgres-init jobs.
    nameOverride: certify-pg-init
    postgresql:
      host: '{{ tpl .Values.global.postgresqlHost $ }}'
      existingSecret: '{{ tpl .Values.global.postgresqlSecret $ }}'
      existingSecretPostgresPasswordKey: '{{ tpl .Values.global.postgresqlSecretKey $ }}'

openg2p-iam-service:
  enabled: true
  # Image/tag and application env come from the IAM chart. Commons only wires
  # hostnames, DB names, and resources so this install stays in sync with
  # Keycloak redirect URIs and the shared Postgres.
  iamStaffPortalApi:
    # Override the subchart default ('staff-{{ iamHostname }}') with our global
    # so the deployment hostname AND the Keycloak redirect URI stay in sync.
    hostname: '{{ tpl .Values.global.staffPortalApiHostname $ }}'
    image:
      # registry.gitlab.com, NOT Docker Hub. `openg2p/iam-staff-portal-api` is
      # the pre-migration Docker Hub build and is no longer published, so it
      # silently pins this service to whatever was last pushed there -- it was
      # missing every IAM change since the GitLab move, with no error anywhere.
      # Matches iamAgentPortalApi and iamStaffUi below.
      repository: registry.gitlab.com/openg2p/iam/iam-staff-portal-api
      tag: "develop"
    # Based on observed usage ~159Mi. Python FastAPI app.
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
  iamAgentPortalApi:
    hostname: '{{ tpl .Values.global.agentPortalApiHostname $ }}'
    # Same profile as the staff API — a Python FastAPI app doing OIDC login.
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
  global:
    iamHostname: '{{ tpl .Values.global.iamHostname $ }}'
    postgresqlHost: '{{ tpl .Values.global.postgresqlHost $ }}'
    # Plain DB names (no release-name prefix). Only one instance per env.
    iamDB: iam
    iamDBUser: iam_user
    iamDBSecret: iam
    iamDBUserPasswordKey: iam-db-user
    # NOTE: no keycloakBaseUrl override here. Helm merges the parent
    # global.keycloakBaseUrl into the subchart. The IAM chart must tpl
    # IAM_*_KEYCLOAK_BASE_URL (same as ADMIN_URL) so the nested baseDomain
    # template resolves instead of leaking as literal '{{ tpl ... }}' text.
    staffPortalDefaultRedirectUri: 'https://staff-portal.{{ tpl .Values.global.baseDomain $ }}'
    # Without this the subchart default pins the agent redirect to the literal
    # 'trial' domain, so every other environment gets a redirect it does not own.
    agentPortalDefaultRedirectUri: 'https://{{ tpl .Values.global.agentPortalHostname $ }}'
    keycloakApplicationUrl: 'https://keycloak.{{ tpl .Values.global.baseDomain $ }}'
    registryApplicationUrl: 'https://registry.{{ tpl .Values.global.baseDomain $ }}'
    minioApplicationUrl: 'https://minio.{{ tpl .Values.global.baseDomain $ }}'
    supersetApplicationUrl: 'https://{{ tpl .Values.global.supersetHostname $ }}'
  postgres-init:
    enabled: true
    nameOverride: iam-pg-init
    commonAnnotations:
      "helm.sh/hook": null
      "helm.sh/hook-weight": null
      "helm.sh/hook-delete-policy": null
    postgresql:
      host: '{{ tpl .Values.global.postgresqlHost $ }}'
      port: 5432
      existingSecret: '{{ tpl .Values.global.postgresqlSecret $ }}'
      existingSecretPostgresPasswordKey: '{{ tpl .Values.global.postgresqlSecretKey $ }}'

openg2p-audit-manager:
  enabled: true
  global:
    auditManagerHostname: 'auditmanager.{{ tpl .Values.global.baseDomain $ }}'
    postgresqlHost: '{{ tpl .Values.global.postgresqlHost $ }}'
    # Plain DB names (no release-name prefix). Only one instance per env.
    auditManagerDB: audit_manager
    auditManagerDBUser: audit_manager_user
    auditManagerDBSecret: audit-manager
    auditManagerDBUserPasswordKey: audit-manager-db-user
    # NOTE: Audit-manager subchart does not tpl this value. Default assumes
    # base release name is 'commons'. Override via --set or install.sh.
    kafkaBootstrapServers: 'commons-kafka:9092'
  postgres-init:
    enabled: true
    # Short nameOverride to keep total Job name under 63 chars
    # (Job = <release>-<nameOverride>-<release>-<dbName>).
    nameOverride: audit-pg-init
    commonAnnotations:
      "helm.sh/hook": null
      "helm.sh/hook-weight": null
      "helm.sh/hook-delete-policy": null
    postgresql:
      host: '{{ tpl .Values.global.postgresqlHost $ }}'
      port: 5432
      existingSecret: '{{ tpl .Values.global.postgresqlSecret $ }}'
      existingSecretPostgresPasswordKey: '{{ tpl .Values.global.postgresqlSecretKey $ }}'
  auditManager:
    enabled: true
    # Service name becomes <release-name>-auditmanager (e.g. commons-services-auditmanager)
    nameOverride: auditmanager
    # Sandbox: single replica, no autoscaling. For production, increase replicaCount
    # to match Kafka topic partitions and enable HPA.
    replicaCount: 1
    autoscaling:
      enabled: false
    # Based on the chart's commented-out reference values.
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
    # Kafka topic provisioning runs as a Helm hook by default (Rancher skips hooks).
    # Nullify hook annotations so the topic-init Job runs as a regular resource.
    topicInit:
      enabled: true
      commonAnnotations:
        "helm.sh/hook": null
        "helm.sh/hook-weight": null
        "helm.sh/hook-delete-policy": null

openg2p-staff-portal-ui:
  enabled: true
  global:
    # All values are templated; they get resolved via tpl in the subchart's env-var
    # rendering. Override any of these via --set or in commons globals (top-level
    # globals are also exposed in questions.yaml).
    staffPortalHostname: '{{ tpl .Values.global.staffPortalHostname $ }}'
    cookieDomain: '{{ tpl .Values.global.staffPortalCookieDomain $ }}'
    keycloakBaseUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}'
    keycloakRealm: '{{ tpl .Values.global.keycloakRealm $ }}'
    iamServiceUrl: '{{ tpl .Values.global.iamServiceUrl $ }}'
  staffPortalUi:
    enabled: true
    nameOverride: staff-portal-ui
    replicaCount: 1
    # Lightweight Node.js UI.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

# ─────────────────────────────────────────────────────────────────────────────
# Approval Workflow Engine (AWE) — a single shared instance for the whole
# environment. Self-contained: its bundled postgres-init (awe-pg-init) creates
# the `awe` database/user (per the global.aweDB* contract), and its keycloak-init
# (awe-kc-init) provisions the awe-admin-portal / awe-admin-resolver clients in
# the shared `staff` realm and grants the `admin` user AWE_ADMIN.
# Registries (NSR, Farmer Registry) no longer install their own AWE — they point
# global.aweBaseUrl at https://<global.aweHostname> and register their per-registry
# callback secret into this AWE's DB.
# ─────────────────────────────────────────────────────────────────────────────
openg2p-awe:
  enabled: true
  # Keycloak issuer split (same as Partner Management / Consent Manager): the
  # token `iss` is the EXTERNAL issuer — real users log in via the public
  # Keycloak hostname, so their tokens (which the registry forwards to AWE)
  # carry the external issuer — while JWKS is still fetched from the INTERNAL
  # Keycloak URL. The openg2p-awe subchart defaults `issuer` to the internal URL
  # (global.keycloakIssuerUrl), which rejects real user tokens with
  # "Invalid issuer" (AWE-ERR-006) on every change-request approval. Override
  # just the issuer here; jwksUrl keeps the subchart's internal default.
  awe:
    appConfig:
      keycloak:
        issuer: '{{ tpl .Values.global.keycloakExternalIssuerUrl $ }}'
  postgres-init:
    enabled: true
    # Distinct Job name within the commons-services release.
    nameOverride: awe-pg-init
  keycloak-init:
    enabled: true
    nameOverride: awe-kc-init

# ─────────────────────────────────────────────────────────────────────────────
# Partner Management — central registry of partner public keys, deployed as
# `commons-services-pm-*`. Components are pm-prefixed to avoid colliding with the
# commons staff-portal-ui. The PM standalone chart is unchanged; everything below
# is embedding config (names + internal cross-refs, plain DB names, and the
# Keycloak issuer split: token `iss` = EXTERNAL issuer, JWKS fetched INTERNALLY).
# It inherits keycloak/postgres/iam from the shared `global`.
# ─────────────────────────────────────────────────────────────────────────────
partner-management:
  enabled: true
  global:
    # Plain DB name/user/secret (no release-name prefix), like iam / audit_manager.
    pmDB: partner_management
    pmDBUser: partner_management_user
    pmDBSecret: partner-management-db
    pmDBUserPasswordKey: partner-management-db-user
    # Hostnames off the shared baseDomain (PM's own default is namespace-based).
    staffPortalUiHostname: 'partner-management.{{ tpl .Values.global.baseDomain $ }}'
    staffPortalApiHostname: 'partner-management-staff-portal-api.{{ tpl .Values.global.baseDomain $ }}'
    partnerApiHostname: 'partner-management-partner-api.{{ tpl .Values.global.baseDomain $ }}'
    cookieDomain: '.{{ tpl .Values.global.baseDomain $ }}'
  staffPortalApi:
    nameOverride: pm-staff-portal-api
    istio:
      virtualservice:
        destination: '{{ .Release.Name }}-pm-staff-portal-api'
    envVars:
      # Token `iss` is the EXTERNAL issuer; JWKS is fetched from the INTERNAL
      # Keycloak URL (commons splits these two).
      COMMON_AUTH_DEFAULT_ISSUERS: '["{{ tpl .Values.global.keycloakExternalIssuerUrl $ }}"]'
      COMMON_AUTH_DEFAULT_JWKS_URLS: '["{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/certs"]'
  partnerApi:
    nameOverride: pm-partner-api
    istio:
      virtualservice:
        destination: '{{ .Release.Name }}-pm-partner-api'
  staffPortalUi:
    nameOverride: pm-staff-portal-ui
    istio:
      virtualservice:
        destination: '{{ .Release.Name }}-pm-staff-portal-ui'
    envVars:
      STAFF_PORTAL_API_URL: 'http://{{ .Release.Name }}-pm-staff-portal-api'
  postgres-init:
    enabled: true
    # Distinct Job name; run as a regular resource (Rancher skips helm hooks).
    nameOverride: pm-pg-init
    commonAnnotations:
      "helm.sh/hook": null
      "helm.sh/hook-weight": null
      "helm.sh/hook-delete-policy": null
  keycloak-init:
    enabled: true
    nameOverride: pm-kc-init
  # Grants the partner_manager role to the staff-portal client's SERVICE ACCOUNT
  # (so headless onboarding via client-credentials works — see the PM chart). Run
  # as a regular resource: Rancher skips helm hooks, so null the hook annotations.
  keycloakServiceAccountRole:
    enabled: true
    annotations:
      "helm.sh/hook": null
      "helm.sh/hook-weight": null
      "helm.sh/hook-delete-policy": null

# ─────────────────────────────────────────────────────────────────────────────
# Consent Manager (CM) — the PDP for outbound data sharing. OFF by default;
# enable with openg2p-consent-manager.enabled=true (surfaced in questions.yaml).
# Deployed as commons-services-cm-* : the staff api, the partner api (the
# /validate PDP), and the admin UI. CM verifies partner-signed consent objects
# against the in-cluster Partner Management keys (commons-services-pm-partner-api).
openg2p-consent-manager:
  enabled: true
  global:
    # Plain DB name/user/secret (no release-name prefix), like partner-management.
    consentDB: consent_manager
    consentDBUser: consent_manager_user
    consentDBSecret: consent-manager-db
    consentDBUserPasswordKey: consent-manager-db-user
    # Hostnames off the shared baseDomain.
    consentManagerHostname: 'consent-manager.{{ tpl .Values.global.baseDomain $ }}'
    consentManagerPartnerHostname: 'consent-manager-partner.{{ tpl .Values.global.baseDomain $ }}'
    consentManagerBeneHostname: 'consent-manager-bene.{{ tpl .Values.global.baseDomain $ }}'
    # CM verifies partner keys against the in-cluster PM (same commons release).
    partnerManagementApiUrl: http://commons-services-pm-partner-api
    partnerManagementAdminApiUrl: http://commons-services-pm-staff-portal-api
    pmSeedClientId: commons-services-staff-portal
  # STAFF api — commons-services-cm-api. Token `iss` is the EXTERNAL issuer; JWKS
  # is fetched from the INTERNAL Keycloak URL (commons splits these two).
  consentManagerApi:
    nameOverride: cm-api
    istio:
      virtualservice:
        destination: '{{ .Release.Name }}-cm-api'
    envVars:
      CONSENT_MANAGER_AUTH_ISSUER: '{{ tpl .Values.global.keycloakExternalIssuerUrl $ }}'
      CONSENT_MANAGER_AUTH_JWKS_URL: '{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/certs'
  # PARTNER api (the PDP /validate, no Keycloak) + scaffolded BENEFICIARY api.
  # Helm arrays REPLACE (not merge), so the full list is re-declared with cm-*
  # names + matching istio destinations.
  extraApis:
    - enabled: true
      nameOverride: cm-partner-api
      apiAudience: partner
      authEnabled: 'false'
      signingKeyMounted: true
      hostname: '{{ tpl .Values.global.consentManagerPartnerHostname $ }}'
      openapiRootPath: /api/consent-manager-partner
      istio:
        enabled: true
        virtualservice:
          enabled: true
          host: '{{ tpl .Values.global.consentManagerPartnerHostname $ }}'
          gateway: "internal"
          destination: '{{ .Release.Name }}-cm-partner-api'
          destinationPort: 80
          prefix: /api/consent-manager-partner/
          rewriteUri: "/"
        gateway:
          enabled: false
    - enabled: false
      nameOverride: cm-bene-api
      apiAudience: beneficiary
      authEnabled: 'true'
      signingKeyMounted: false
      hostname: '{{ tpl .Values.global.consentManagerBeneHostname $ }}'
      openapiRootPath: /api/consent-manager-bene
      istio:
        enabled: true
        virtualservice:
          enabled: true
          host: '{{ tpl .Values.global.consentManagerBeneHostname $ }}'
          gateway: "internal"
          destination: '{{ .Release.Name }}-cm-bene-api'
          destinationPort: 80
          prefix: /api/consent-manager-bene/
          rewriteUri: "/"
        gateway:
          enabled: false
  ui:
    nameOverride: cm-ui
    istio:
      virtualservice:
        destination: '{{ .Release.Name }}-cm-ui'
  postgres-init:
    enabled: true
    # Distinct Job name; run as a regular resource (Rancher skips helm hooks).
    nameOverride: cm-pg-init
    commonAnnotations:
      "helm.sh/hook": null
      "helm.sh/hook-weight": null
      "helm.sh/hook-delete-policy": null
  keycloak-init:
    enabled: true
    nameOverride: cm-kc-init
  # Don't create test data in a commons install by default — smoke only.
  sanity:
    runE2e: false
    # Prefix the sanity + pm-seed Job names with 'cm', matching the other CM
    # components (cm-api/cm-ui/…): <release>-cm-sanity / <release>-cm-pm-seed.
    nameOverride: cm
    # The CM APIs are renamed to <release>-cm-api / <release>-cm-partner-api via
    # nameOverride above, so the subchart's default sanity URLs (<release>-api /
    # <release>-partner-api) don't resolve ("Name or service not known"). Point
    # them at the actual cm-prefixed in-cluster Services.
    baseUrl: 'http://{{ .Release.Name }}-cm-api'
    partnerBaseUrl: 'http://{{ .Release.Name }}-cm-partner-api'

# ─────────────────────────────────────────────────────────────────────────────
# keycloak-init for services-owned clients (superset, odk, staff-portal).
# Runs alongside the commons-base keycloak-init job. Both create their respective
# clients in the same Keycloak (idempotent — clients are checked before creation).
# Each chart owns the redirect URIs for its own services.
# ─────────────────────────────────────────────────────────────────────────────
keycloak-init:
  enabled: true
  keycloak:
    # Internal cluster URL of the Keycloak server (created by commons-base).
    url: '{{ tpl .Values.global.keycloakInternalUrl $ }}'
    # Subchart doesn't tpl this field — must be a literal string.
    user: admin
    password: ''
    # Admin secret created by the commons-base Keycloak chart.
    existingSecret: '{{ tpl .Values.global.keycloakAdminSecret $ }}'
    # Subchart doesn't tpl this field — must be a literal string.
    existingSecretKey: admin-password
  job:
    backoffLimit: 3
    ttlSecondsAfterFinished: 86400
  realms:
    # ── The `agent` realm ──────────────────────────────────────────────────
    # Owned here for the same reason as `staff`: the client is CONFIDENTIAL and
    # iam-agent-portal-api is its only consumer, so the client and the Secret
    # holding its secret must be created by the release that configures that
    # API. A registry creating it per-release would produce a Secret named after
    # the release (e.g. fr-agent-portal), which the IAM chart does not look for,
    # leaving the login_providers row with a placeholder secret and no way to
    # complete a code exchange.
    agent:
      # Same OpenG2P theme as the `staff` realm (set by commons-base for that
      # one). Without it the agent lands on Keycloak's stock login page, which
      # looks nothing like the rest of the product.
      themes:
        loginTheme: staff-portal
        adminTheme: staff-portal
      # Shown on the login page. The theme is shared with `staff`, so without a
      # display name the two login screens are indistinguishable apart from the
      # URL -- and an agent who lands on the wrong one gets an unhelpful
      # "invalid credentials" rather than "wrong portal".
      displayName: 'OpenG2P Agent'
      clients:
        - clientId: agent-portal
          name: Agent Portal
          # Used by IAM agent portal API for the agent portal login flow.
          # First URI = IAM API callback, second = agent portal UI.
          redirectUris:
            - 'https://{{ tpl .Values.global.agentPortalApiHostname $ }}/*'
            - 'https://{{ tpl .Values.global.agentPortalHostname $ }}/*'
          # The single capability an agent has. Defined on the client the agent's
          # token is minted for, so resource_access carries it.
          clientRoles:
            - "register:issue_credential"
    staff:
      clients:
        - clientId: openg2p-superset
          name: Superset
          redirectUris:
            - 'https://{{ tpl .Values.global.supersetHostname $ }}/*'
          clientRoles: ["Admin"]
        - clientId: openg2p-odk
          name: ODK
          redirectUris:
            - 'https://{{ tpl .Values.global.odkHostname $ }}/*'
        - clientId: staff-portal
          name: Staff Portal
          # Used by IAM staff portal API for the staff portal login flow.
          # First URI = IAM API callback, second = staff portal UI.
          redirectUris:
            - 'https://{{ tpl .Values.global.staffPortalApiHostname $ }}/*'
            - 'https://{{ tpl .Values.global.staffPortalHostname $ }}/*'
      users:
        # Add admin role mappings for services-owned clients.
        # The admin user itself is created by commons-base keycloak-init;
        # this entry adds the role mappings idempotently.
        - username: admin
          email: admin@your.domain.com
          clientRoleMappings:
            openg2p-superset:
              - "Admin"
